[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fineqcomp"
version = "0.1.0"
description = "Real-task rate-performance experiments for quantized LLM finetuning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "accelerate==1.14.0",
  "bitsandbytes==0.50.0; platform_system == 'Linux'",
  "datasets==5.0.0",
  "math-verify[antlr4-13-2]==0.9.0",
  "matplotlib==3.11.0",
  "numpy==2.4.6",
  "peft==0.19.1",
  "pyyaml==6.0.3",
  "rouge-score==0.1.2",
  "torch==2.12.0",
  "tqdm>=4.66",
  "transformers==5.10.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
fineqcomp = "fineqcomp.progress_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
