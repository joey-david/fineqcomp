# F02 -- when does the final budget become predictable?
#
# Claim: the final correction rate becomes forecastable only after a measurable
# amount of optimization evidence, and that observation threshold transfers to
# receivers the threshold was not measured on.
#
# bit_budget.yaml already asks whether a capped probe predicts a finished
# adapter's budget. It asks it at one seed, so it cannot say when the answer
# stops changing. This file keeps every one of its studies unchanged -- the
# identity fields are copied, so those probes are not retrained -- and adds a
# second data order at seed 22 across the 1, 8 and 64 update budgets on the two
# corpora and two receivers that carry the most finished targets.
#
# The threshold is read off the pair, not off either half. Two forks of the
# same corpus and receiver that differ only in data order should disagree about
# the final budget early and agree late; the update count at which their
# forecasts converge, and stay converged, is the observation threshold. A
# threshold that is the same on Mistral and Qwen is the transfer claim.
#
# Stage order is the guard and is not optional: manifest, then check, then
# probes, then sweep, then report. `check` proves every cell has a finished
# adapter to predict and a prepared corpus to read, and a non-zero exit there
# stops the chain before a GPU is spent.
version: 1
information_rows: 256
evaluation_batch_size: 32
gates:
