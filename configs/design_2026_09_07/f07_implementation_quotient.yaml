# F07 -- how much rate remains after quotienting implementations?
#
# Claim: most of the spread in compressed adapter size across rank and seed is
# redundant implementation of the same correction, and a fixed functional
# recoding removes it.
#
# The two study names, models, datasets, seeds, training key and row caps are
# copied from transposed_receiver_panel.yaml, so the twelve rank-16 cells are
# adapters that panel already trained and cost nothing here. The rank 2, 8 and
# 32 cells are new training: 36 new adapters per corpus pair, two receivers,
# three seeds.
#
# Read it as spread, not as level. Four ranks and three seeds on one corpus and
# receiver give twelve files that implement the same learned function; if the
# byte spread across them is large before recoding and small after, that spread
# was implementation. Exact LoRA gauge transformations of one trained adapter
# are the sanity check and cost no GPU.
#
# Blocking the full design: distilling every cell into one fixed low-rank
# student at held-out fidelity needs a distillation path the runner does not
# have. Without it this config measures the spread but cannot quotient it, so
# it is the first half of F07.
version: 1
information_rows: 256
evaluation_batch_size: 32
codecs:
  fp16:
    method: uniform
    bits: 16
  uniform2:
    method: uniform
    bits: 2
  blend1_50:
    method: uniform
    bits: 1
    blend: 0.5
  binary:
    method: uniform
    bits: 1
  sub0_750:
    method: uniform
    bits: 0
    blend: 0.75
  sub0_500:
    method: uniform
    bits: 0
    blend: 0.5
  sub0_250:
    method: uniform
    bits: 0
    blend: 0.25
  sub0_125:
    method: uniform
    bits: 0
    blend: 0.125
  sub0_0625:
    method: uniform
    bits: 0
    blend: 0.0625
models:
  mistral_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/mistralai/Mistral-7B-v0.1
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  qwen25_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-7B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
adapters:
  all_linear_r2:
    method: full_lora
    rank: 2
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    last_n_layers: null
    alpha: 4
    dropout: 0.0
  all_linear_r8:
    method: full_lora
    rank: 8
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    last_n_layers: null
    alpha: 16
    dropout: 0.0
  all_linear_r16:
    method: full_lora
    rank: 16
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    last_n_layers: null
    alpha: 32
    dropout: 0.0
  all_linear_r32:
    method: full_lora
    rank: 32
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    last_n_layers: null
    alpha: 64
    dropout: 0.0
training:
  panel_4ep:
    epochs: 4
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
datasets:
  kind_code:
    task_type: generative
    train_source:
      path: ise-uiuc/Magicoder-Evol-Instruct-110K
      name: default
      revision: b0079beaa0361d82412520b873715bee59cc7dd4
      split: train
      converter: magicoder
    validation_rows: 256
    train_rows: 8000
    test_rows: 164
    evaluations:
    - key: humaneval
      path: openai/openai_humaneval
      name: openai_humaneval
      revision: 7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544
      split: test
      converter: humaneval
    screening_metric: pass_at_1
    maximum_baseline_score: 0.75
    minimum_validation_nll_gain_bits_per_token: 0.02
  xbrl_tags:
    task_type: generative
    train_source:
      path: wangd12/XBRL_analysis
      name: tags
      revision: 6ee79f739a6c51d4ec39921693ee3d7e0cd54c17
      split: train
      converter: xbrl_tags
    validation_rows: 256
    train_rows: 8000
    test_rows: 500
    evaluations:
    - key: xbrl_tags
      path: wangd12/XBRL_analysis
      name: tags
      revision: 6ee79f739a6c51d4ec39921693ee3d7e0cd54c17
      split: test
      converter: xbrl_tags
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
studies:
  transposed_code:
    kind: natural
    models:
    - mistral_7b_base
    - qwen25_7b_base
    datasets:
    - kind_code
    seeds:
    - 11
    - 22
    - 33
    adapters:
    - all_linear_r16
    - all_linear_r2
    - all_linear_r8
    - all_linear_r32
    training: panel_4ep
  transposed_xbrl:
    kind: natural
    models:
    - mistral_7b_base
    - qwen25_7b_base
    datasets:
    - xbrl_tags
    seeds:
    - 11
    - 22
    - 33
    adapters:
    - all_linear_r16
    - all_linear_r2
    - all_linear_r8
    - all_linear_r32
    training: panel_4ep
