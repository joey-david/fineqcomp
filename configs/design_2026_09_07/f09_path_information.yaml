# F09 -- is optimization-path information real or arbitrary?
#
# Claim: only newly acquired functional distinctions along the optimization
# path predict final storage. Distance travelled in weight space can grow
# without any increase in the correction information that has to be sent.
#
# behavioral_trajectory.yaml already checkpoints an aligned and a permuted
# fine-tune and prices each checkpoint. This file keeps its source lock, arms,
# models and seeds and only reads the path more finely: eight checkpoints
# instead of five, so the two quantities can be plotted against each other
# rather than against the endpoint.
#
# The two curves are the whole experiment. Cumulative geometric length of the
# update path is monotone by construction and says nothing on its own. Rate at
# fixed retained gain is what has to be sent. F09 survives if segments exist
# where the path keeps lengthening and the rate does not move, and dies if rate
# tracks path length everywhere.
#
# The permuted arm is the strong version of that test: it travels a comparable
# distance while learning a correction that is largely damage, so it should
# separate the two curves without any new intervention.
#
# Blocking the full design: reversible learning/unlearning cycles and reordered
# modules at matched final function need a training schedule the trajectory
# module does not accept. The `restart`, `truncate` and `random` interventions
# it does have are the weaker stand-in, and they perturb the path rather than
# closing a loop in it.
