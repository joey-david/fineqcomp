# F12 -- shared corrections create subadditive storage.
#
# Claim: the cost of learning several behaviours is set by the corrective
# structure they share, so a joint code can be much smaller than the sum of
# separately trained ones.
#
# Subadditivity is a comparison against a sum, and the sum has to be measured
# before the joint code means anything. This file measures it. The three
# transposed studies keep their identity fields, so those eighteen adapters are
# already trained and cost nothing; only the SQL arm is new. That gives four
# behaviours on two receivers at three seeds, with two pairs chosen for how
# much they plausibly share: XBRL tagging and text-to-SQL are both
# schema mapping, while code generation and grade-school maths are not.
#
# What the separate arms alone can already settle: whether the pair that looks
# like it shares structure has closer rate-distortion curves and closer
# adapters than the pair that does not. If the two pairs are indistinguishable
# on the separate arms, the sharing axis is not real and the joint arm has
# nothing to be subadditive about.
#
# Blocking the full design: joint training over two corpora, sequential
# training, a charged task selector over separate adapters, and merged or
# distilled adapters all need a multi-dataset run the runner does not express
# -- one run is one dataset. Until that exists this config is the additivity
# baseline, not the subadditivity test.
version: 1
information_rows: 256
evaluation_batch_size: 32
codecs:
  fp16:
    method: uniform
    bits: 16
  uniform2:
    method: uniform
    bits: 2
  blend1_50:
    method: uniform
    bits: 1
    blend: 0.5
  binary:
    method: uniform
    bits: 1
  sub0_750:
    method: uniform
    bits: 0
    blend: 0.75
  sub0_500:
    method: uniform
    bits: 0
    blend: 0.5
  sub0_250:
    method: uniform
    bits: 0
    blend: 0.25
  sub0_125:
    method: uniform
    bits: 0
    blend: 0.125
models:
  mistral_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/mistralai/Mistral-7B-v0.1
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  qwen25_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-7B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
adapters:
  all_linear_r16:
    method: full_lora
    rank: 16
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    last_n_layers: null
    alpha: 32
    dropout: 0.0
training:
  panel_4ep:
    epochs: 4
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
datasets:
  kind_code:
    task_type: generative
    train_source:
      path: ise-uiuc/Magicoder-Evol-Instruct-110K
      name: default
      revision: b0079beaa0361d82412520b873715bee59cc7dd4
      split: train
      converter: magicoder
    validation_rows: 256
    train_rows: 8000
    test_rows: 164
    evaluations:
    - key: humaneval
      path: openai/openai_humaneval
      name: openai_humaneval
      revision: 7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544
      split: test
      converter: humaneval
    screening_metric: pass_at_1
    maximum_baseline_score: 0.75
    minimum_validation_nll_gain_bits_per_token: 0.02
  panel_math:
    task_type: generative
    train_source:
      path: meta-math/MetaMathQA
      name: default
      revision: aa4f34d3d2d3231299b5b03d9b3e5a20da45aa18
      split: train
      converter: metamath
    validation_rows: 256
    train_rows: 8000
    test_rows: 1319
    evaluations:
    - key: gsm8k
      path: openai/gsm8k
      name: main
      revision: 740312add88f781978c0658806c59bc2815b9866
      split: test
      converter: gsm8k
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
  xbrl_tags:
    task_type: generative
    train_source:
      path: wangd12/XBRL_analysis
      name: tags
      revision: 6ee79f739a6c51d4ec39921693ee3d7e0cd54c17
      split: train
      converter: xbrl_tags
    validation_rows: 256
    train_rows: 8000
    test_rows: 500
    evaluations:
    - key: xbrl_tags
      path: wangd12/XBRL_analysis
      name: tags
      revision: 6ee79f739a6c51d4ec39921693ee3d7e0cd54c17
      split: test
      converter: xbrl_tags
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
  text_to_sql:
    task_type: generative
    train_source:
      path: gretelai/synthetic_text_to_sql
      name: default
      revision: 740ab236e64503fba51be1101df7a1be83bf455d
      split: train
      converter: text_to_sql
    validation_rows: 256
    train_rows: 8000
    test_rows: 500
    evaluations:
    - key: text_to_sql
      path: gretelai/synthetic_text_to_sql
      name: default
      revision: 740ab236e64503fba51be1101df7a1be83bf455d
      split: test
      converter: text_to_sql
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
