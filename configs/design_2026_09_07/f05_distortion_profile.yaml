      path: openai/openai_humaneval
      name: openai_humaneval
      revision: 7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544
      split: test
      converter: humaneval
    screening_metric: pass_at_1
    maximum_baseline_score: 0.75
    minimum_validation_nll_gain_bits_per_token: 0.02
  panel_math:
    task_type: generative
    train_source:
      path: meta-math/MetaMathQA
      name: default
      revision: aa4f34d3d2d3231299b5b03d9b3e5a20da45aa18
