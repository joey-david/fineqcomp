    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  qwen3_8b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen3-8B-Base
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  qwen25_math_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-Math-7B
    revision: dsdir-shared-store
    backbone: nf4
