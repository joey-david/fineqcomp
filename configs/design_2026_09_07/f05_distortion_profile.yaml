    kind: natural
    models: &id001
    - mistral_7b_base
    - llama31_8b_base
    - qwen25_7b_base
    - qwen3_8b_base
    - qwen25_math_7b_base
    - gemma2_9b_base
    - gemma2_9b_instruct
    datasets:
    - kind_code
    seeds: &id002
    - 11
    - 22
    - 33
    adapters: &id003
    - all_linear_r16
    training: panel_4ep
