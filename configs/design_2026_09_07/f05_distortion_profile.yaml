# F05 -- a functional distortion profile replaces one complexity scalar.
#
# Claim: correction storage depends on the distribution of independently
# necessary functional distinctions, so corpora with equal total information
# can have predictably different rate-distortion curves.
#
# This file trains nothing. Studies, models, datasets, seeds, adapter, training
# key and row caps are copied verbatim from transposed_receiver_panel.yaml, so
# every run id expands onto an adapter that panel already trained; only the
# codec ladder differs. `run` reuses the stored raw adapter and adds the
# missing rungs.
#
# What it buys is the whole achievable curve on each corpus and receiver rather
# than one r90 crossing: sixteen rungs from sub-one-bit to fp16, every one of
# them scoring the task, so the curve can be read at any margin instead of at
# the single margin a scalar was fitted to. Two corpora with the same fitted
# r90 and different curve shapes is the F05 signal; identical curves kill it.
#
# Blocking the full design: the query-weight arm -- uniform against
# heavy-tailed against block-correlated evaluation mass at fixed total entropy
# -- needs weighted evaluation with importance weights, which the evaluator
# does not have. This config is the measurement half of F05, not the test.
version: 1
information_rows: 256
evaluation_batch_size: 32
codecs:
  fp16:
    method: uniform
    bits: 16
  uniform4:
    method: uniform
    bits: 4
  uniform3:
    method: uniform
    bits: 3
  uniform2:
    method: uniform
    bits: 2
  blend1_75:
    method: uniform
    bits: 1
    blend: 0.75
  blend1_50:
    method: uniform
    bits: 1
    blend: 0.5
  blend1_25:
    method: uniform
    bits: 1
    blend: 0.25
  binary:
    method: uniform
    bits: 1
  sub0_875:
    method: uniform
    bits: 0
    blend: 0.875
  sub0_750:
    method: uniform
    bits: 0
    blend: 0.75
  sub0_625:
    method: uniform
    bits: 0
    blend: 0.625
  sub0_500:
    method: uniform
    bits: 0
    blend: 0.5
  sub0_375:
    method: uniform
    bits: 0
    blend: 0.375
  sub0_250:
    method: uniform
    bits: 0
    blend: 0.25
  sub0_125:
    method: uniform
    bits: 0
    blend: 0.125
  sub0_0625:
    method: uniform
    bits: 0
    blend: 0.0625
models:
  mistral_7b_base:
