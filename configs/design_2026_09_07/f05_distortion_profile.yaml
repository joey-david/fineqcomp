    revision: dsdir-shared-store
    backbone: nf4
    chat: false
adapters:
  all_linear_r16:
    method: full_lora
    rank: 16
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    last_n_layers: null
    alpha: 32
    dropout: 0.0
training:
