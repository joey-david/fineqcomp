# F14 -- a representability transition, not a rank sweep.
#
# Claim: adapter architecture changes correction rate mainly when it crosses a
# functional representability threshold; rank beyond that threshold adds
# implementation overhead rather than new behaviour.
#
# Seven ranks spanning six doublings on one corpus and two receivers, at one
# seed. The identity fields come from transposed_receiver_panel.yaml, so the
# rank-16 cells are already trained and only twelve adapters are new.
#
# XBRL tag mapping is the corpus on purpose: it is the panel's most nearly
# deterministic task, so a threshold in what the adapter can represent is not
# hidden under sampling noise in the score.
#
# The prediction that distinguishes a transition from a smooth sweep: retained
# gain rises steeply up to some rank and then flattens, while the serialized
# bytes at fixed retained gain stop falling at the same rank. If bytes keep
# falling past the knee, excess rank is not overhead and the claim fails.
#
# Pair this with `fineqcomp rank-frontier` on the rank-64 runs: truncating one
# wide adapter and training a narrow one are different objects, and F14 needs
# both curves to separate representability from optimisation.
version: 1
information_rows: 256
evaluation_batch_size: 32
codecs:
  fp16:
    method: uniform
    bits: 16
  uniform2:
    method: uniform
    bits: 2
  blend1_50:
    method: uniform
    bits: 1
    blend: 0.5
  binary:
    method: uniform
    bits: 1
  sub0_750:
    method: uniform
    bits: 0
    blend: 0.75
  sub0_500:
    method: uniform
    bits: 0
    blend: 0.5
  sub0_250:
    method: uniform
    bits: 0
    blend: 0.25
  sub0_125:
    method: uniform
    bits: 0
    blend: 0.125
  sub0_0625:
    method: uniform
    bits: 0
    blend: 0.0625
