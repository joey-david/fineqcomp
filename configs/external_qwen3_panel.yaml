# Clean fourth-receiver test for the scale-free correction effective rank.
# This file is fixed before any Qwen3 R* result is opened.
version: 1
information_rows: 256
evaluation_batch_size: 32
codecs:
  uniform2: {method: uniform, bits: 2}
  blend1_50: {method: uniform, bits: 1, blend: 0.5}
  binary: {method: uniform, bits: 1}
  sub0_14_16: {method: uniform, bits: 0, blend: 0.875, score_task: false}
  sub0_13_16: {method: uniform, bits: 0, blend: 0.8125, score_task: false}
  sub0_12_16: {method: uniform, bits: 0, blend: 0.75, score_task: false}
  sub0_11_16: {method: uniform, bits: 0, blend: 0.6875, score_task: false}
  sub0_10_16: {method: uniform, bits: 0, blend: 0.625, score_task: false}
  sub0_09_16: {method: uniform, bits: 0, blend: 0.5625, score_task: false}
  sub0_08_16: {method: uniform, bits: 0, blend: 0.5}
  sub0_07_16: {method: uniform, bits: 0, blend: 0.4375, score_task: false}
  sub0_06_16: {method: uniform, bits: 0, blend: 0.375, score_task: false}
  sub0_05_16: {method: uniform, bits: 0, blend: 0.3125, score_task: false}
  sub0_04_16: {method: uniform, bits: 0, blend: 0.25, score_task: false}
  sub0_03_16: {method: uniform, bits: 0, blend: 0.1875, score_task: false}
  sub0_02_16: {method: uniform, bits: 0, blend: 0.125, score_task: false}
  sub0_01_16: {method: uniform, bits: 0, blend: 0.0625, score_task: false}
models:
  qwen3_8b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen3-8B-Base
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
adapters:
  all_linear_r16:
    method: full_lora
    rank: 16
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 32
    dropout: 0.0
training:
  panel_4ep: &panel_4ep
    epochs: 4
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
  cot_full_1ep: &cot_1ep
    epochs: 1
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
    label_span: all
  cot_reasoning_1ep:
    <<: *cot_1ep
    label_span: reasoning
  cot_answer_1ep:
    <<: *cot_1ep
    label_span: answer
datasets:
  kind_dialogue:
    task_type: generative
    train_source: {path: Anthropic/hh-rlhf, name: default, revision: 09be8c5bbc57cb3887f3a9732ad6aa7ec602a1fa, split: train, converter: hh_rlhf}
    validation_rows: 256
    train_rows: 8000
    test_rows: 60
    evaluations: [{key: gsm8k, path: openai/gsm8k, name: main, revision: 740312add88f781978c0658806c59bc2815b9866, split: test, converter: gsm8k}]
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
  kind_instruct:
    task_type: generative
    train_source: {path: tatsu-lab/alpaca, name: default, revision: dce01c9b08f87459cf36a430d809084718273017, split: train, converter: alpaca}
    validation_rows: 256
    train_rows: 8000
    test_rows: 60
    evaluations: [{key: gsm8k, path: openai/gsm8k, name: main, revision: 740312add88f781978c0658806c59bc2815b9866, split: test, converter: gsm8k}]
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
  kind_code:
    task_type: generative
    train_source: {path: ise-uiuc/Magicoder-Evol-Instruct-110K, name: default, revision: b0079beaa0361d82412520b873715bee59cc7dd4, split: train, converter: magicoder}
    validation_rows: 256
    train_rows: 8000
    test_rows: 164
    evaluations: [{key: humaneval, path: openai/openai_humaneval, name: openai_humaneval, revision: 7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544, split: test, converter: humaneval}]
    screening_metric: pass_at_1
    maximum_baseline_score: 0.75
    minimum_validation_nll_gain_bits_per_token: 0.02
  kind_summary:
    task_type: generative
    screening_binomial: false
    train_source: {path: EdinburghNLP/xsum, name: default, revision: 7d4d486c2f8ef850b1a11aead99b894ff3dd7da9, split: train, converter: xsum}
    validation_rows: 256
    train_rows: 8000
    test_rows: 500
    evaluations: [{key: xsum, path: EdinburghNLP/xsum, name: default, revision: 7d4d486c2f8ef850b1a11aead99b894ff3dd7da9, split: test, converter: xsum}]
    screening_metric: rouge_l
    maximum_baseline_score: 0.45
    minimum_validation_nll_gain_bits_per_token: 0.02
  panel_math:
    task_type: generative
    train_source: &metamath_source {path: meta-math/MetaMathQA, name: default, revision: aa4f34d3d2d3231299b5b03d9b3e5a20da45aa18, split: train, converter: metamath}
    validation_rows: 256
    train_rows: 8000
    test_rows: 1319
    evaluations: [{key: gsm8k, path: openai/gsm8k, name: main, revision: 740312add88f781978c0658806c59bc2815b9866, split: test, converter: gsm8k}]
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
  cot_math:
    task_type: generative
    train_source: *metamath_source
    answer_marker: 'The answer is:'
    validation_rows: 256
    train_rows: 32000
    test_rows: 1319
    evaluations: [{key: gsm8k, path: openai/gsm8k, name: main, revision: 740312add88f781978c0658806c59bc2815b9866, split: test, converter: gsm8k}]
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
studies:
  qwen3_natural:
    kind: natural
    models: [qwen3_8b_base]
    datasets: [kind_code, kind_dialogue, kind_instruct, kind_summary, panel_math]
    seeds: &seeds [11, 22, 33]
    adapters: &adapter [all_linear_r16]
    training: panel_4ep
  qwen3_cot_full:
    kind: natural
    models: [qwen3_8b_base]
    datasets: &cot_dataset [cot_math]
    seeds: *seeds
    adapters: *adapter
    training: cot_full_1ep
  qwen3_cot_reasoning:
    kind: natural
    models: [qwen3_8b_base]
    datasets: *cot_dataset
    seeds: *seeds
    adapters: *adapter
    training: cot_reasoning_1ep
  qwen3_cot_answer:
    kind: natural
    models: [qwen3_8b_base]
    datasets: *cot_dataset
    seeds: *seeds
    adapters: *adapter
    training: cot_answer_1ep
