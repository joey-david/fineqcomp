# Per-direction pass-band study, replicating spectral_regimes_fine (Qwen2.5-7B /
# MetaMathQA) on the Gemma-2-9B-it / NuminaMath-CoT adapters trained by
# configs/generalization_gemma.yaml and adopted with --phase stage. Same design:
# every contiguous window of the 16 singular directions at full precision
# (136), every leave-one-out (16), and the shrinkage controls.
# Probes are a subset of the generalization panel, so the adopted adapters'
# decontaminated training rows are clean against them too.
version: 1
models:
  gemma2_9b_it:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/google/gemma-2-9b-it
    revision: dsdir-shared-store
    backbone: nf4
    chat: true
adapters:
  all_linear_r16:
    method: full_lora
    rank: 16
    alpha: 32
    dropout: 0.0
    last_n_layers: null
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
training:
  cot_full_1ep:
    epochs: 1
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 400
    restore_best: false
    label_span: all
codecs:
  fp16:
    method: uniform
    bits: 16
    score_task: false
datasets:
  numina_cot:
    task_type: generative
    train_source:
      path: AI-MO/NuminaMath-CoT
      name: default
      revision: 9d8d210c9f6a36c8f3cd84045668c9b7800ef517
      split: train
      converter: math
      group_field: problem
    answer_marker: \boxed{
    answer_bearing_only: true
    holdout_by_group: true
    validation_rows: 288
    train_rows: 24000
    test_rows: 500
    evaluations:
    - key: math
      path: HuggingFaceH4/MATH-500
      name: default
      revision: 6e4ed1a2a79af7d8630a6b768ec859cb5af4d3be
      split: test
      converter: math
    screening_metric: exact_match
    maximum_baseline_score: 0.85
    minimum_validation_nll_gain_bits_per_token: 0.0
  numina_cot_permuted:
    task_type: generative
    train_source:
      path: AI-MO/NuminaMath-CoT
      name: default
      revision: 9d8d210c9f6a36c8f3cd84045668c9b7800ef517
      split: train
      converter: math
      group_field: problem
    answer_marker: \boxed{
    answer_bearing_only: true
    holdout_by_group: true
    validation_rows: 288
    train_rows: 24000
    test_rows: 500
    evaluations:
    - key: math
      path: HuggingFaceH4/MATH-500
      name: default
      revision: 6e4ed1a2a79af7d8630a6b768ec859cb5af4d3be
      split: test
      converter: math
    screening_metric: exact_match
    maximum_baseline_score: 0.85
    minimum_validation_nll_gain_bits_per_token: 0.0
    rationale_control: permuted
studies:
  gen_clean:
    kind: natural
    models:
    - gemma2_9b_it
    datasets:
    - numina_cot
    seeds:
    - 11
    adapters:
    - all_linear_r16
    training: cot_full_1ep
  gen_permuted:
    kind: natural
    models:
    - gemma2_9b_it
    datasets:
    - numina_cot_permuted
    seeds:
    - 11
    adapters:
    - all_linear_r16
    training: cot_full_1ep
spectral_transfer:
  seed: 11
  arms:
    clean: gen_clean
    permuted: gen_permuted
  codes:
    fp16:
      bits: 16
  leave_one_out: true
  scales:
