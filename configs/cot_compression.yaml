version: 1

# Experiment 3: does the adapter spend its bits on the reasoning or the answer?
#
# Experiment 2 showed the adapter bit budget tracks how much distinct data the
# training set holds. This asks what the bits are *for*. A math rationale has
# two parts that a fine-tune could be writing down: the working that gets to
# the answer, and the answer itself. Verifiable-reward training only ever
# scores the answer, so if the answer is the cheap part, a verifier-only signal
# buys most of the gain for a fraction of the adapter.
#
# Three arms differ only in which tokens carry the loss, at identical compute
# and identical data: the whole response, the working alone, or the final
# answer alone. The answer-only arm stands in for a verifier-only reward. It is
# a supervision ablation, not policy-gradient RL: there is no sampling and no
# advantage estimate, so it bounds what a verifiable signal can write into an
# adapter rather than reproducing GRPO.
#
# Every arm is then measured on both halves of the held-out response
# separately, so R*(0.90) can be read for the working and for the answer from
# the same checkpoint and the same ladder.
#
# If R*(answer) sits well below R*(reasoning) in every arm, the answer is the
# cheap part to store and a verifier-only signal is buying the cheap part. If
# the two coincide, the adapter does not separate the roles and the whole CoT
# compression framing is empty.

information_rows: 256
evaluation_batch_size: 32

# The same fourteen rungs experiment 2 ended with, which bracketed R*(0.90) on
# held-out bits in all fifteen cells. Only the rungs at one bit and above pay
# for a test pass: below one bit accuracy has already collapsed, and the
# crossing on the accuracy axis sat near 1.4 bits.
codecs:
  uniform2:
    method: uniform
    bits: 2
  blend1_75:
    method: uniform
    bits: 1
    blend: 0.75
  blend1_50:
    method: uniform
    bits: 1
    blend: 0.5
  blend1_25:
    method: uniform
    bits: 1
    blend: 0.25
  binary:
    method: uniform
    bits: 1
  sub0_875:
    method: uniform
    bits: 0
    blend: 0.875
    score_task: false
  sub0_750:
    method: uniform
    bits: 0
    blend: 0.75
    score_task: false
  sub0_625:
    method: uniform
    bits: 0
    blend: 0.625
    score_task: false
  sub0_375:
    method: uniform
    bits: 0
    blend: 0.375
    score_task: false
  sub0_250:
    method: uniform
    bits: 0
    blend: 0.25
    score_task: false
  sub0_1875:
    method: uniform
    bits: 0
    blend: 0.1875
    score_task: false
  sub0_125:
    method: uniform
    bits: 0
    blend: 0.125
    score_task: false
  sub0_0625:
    method: uniform
    bits: 0
    blend: 0.0625
    score_task: false
  sub0_500:
    method: uniform
    bits: 0
    blend: 0.5
    score_task: false

models:
  mistral_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/mistralai/Mistral-7B-v0.1
    revision: dsdir-shared-store
    backbone: nf4
    chat: false

  qwen25_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-7B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false

adapters:
  all_linear_r16:
    method: full_lora
    rank: 16
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 32
    dropout: 0.0

training:
  cot_full_1ep:
    epochs: 1
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
    label_span: all
  cot_reasoning_1ep:
    epochs: 1
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
    label_span: reasoning
  cot_answer_1ep:
    epochs: 1
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
    label_span: answer

datasets:
  # The same 32000 distinct rows and the same 2000 updates as the widest arm of
  # experiment 2, so the three arms here differ from that cell in nothing but
  # which tokens the loss reads.
  cot_math:
    task_type: generative
    train_source:
      path: meta-math/MetaMathQA
      name: default
      revision: aa4f34d3d2d3231299b5b03d9b3e5a20da45aa18
      split: train
      converter: metamath
    # Every MetaMathQA response ends "The answer is: X"; all 32000 training
    # rows and all 256 calibration rows carry it, checked before this ran.
    answer_marker: "The answer is:"
    validation_rows: 256
    train_rows: 32000
    test_rows: 1319
    evaluations:
      - key: gsm8k
        path: openai/gsm8k
        name: main
        revision: 740312add88f781978c0658806c59bc2815b9866
        split: test
        converter: gsm8k
    screening_metric: exact_match
    maximum_baseline_score: 0.80
    minimum_validation_nll_gain_bits_per_token: 0.02

studies:
  sup_full:
    kind: natural
    models: [mistral_7b_base]
    datasets: [cot_math]
    seeds: [11, 22, 33]
    adapters: [all_linear_r16]
    training: cot_full_1ep
  sup_reasoning:
    kind: natural
    models: [mistral_7b_base]
    datasets: [cot_math]
    seeds: [11, 22, 33]
    adapters: [all_linear_r16]
    training: cot_reasoning_1ep
  sup_answer:
    kind: natural
    models: [mistral_7b_base]
    datasets: [cot_math]
    seeds: [11, 22, 33]
    adapters: [all_linear_r16]
    training: cot_answer_1ep
