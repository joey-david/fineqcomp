version: 1

# A fourth kind of functional change, to test whether the curve is shared.
#
# The behavioural-change grid varies output style: five surface rewrites of a
# math response. Every one of them is a shallow change and probably lives in
# the last few layers. If adapter bits track the size of a functional change in
# general, then arms whose change came from somewhere else entirely must fall
# on the same curve.
#
#   code       Magicoder instruction-following. A domain the base handles
#              differently from math; the change is capability, not wording.
#   summary    XSum abstractive summarisation. A different output length
#              regime and a different task altogether.
#
# Matched to the other grids on everything that is not the kind: 8,000 rows,
# 2,000 optimizer updates, 32,000 samples seen, rank-16 all-linear LoRA, the
# same code ladder, three seeds. Sequence length stays at the campaign's 1,024
# for all arms including code, which truncates long programs; that costs some
# code quality and keeps the protocol identical, which is what matters here.
#
# Held-out bits saved is kind-agnostic by construction -- it is the change in
# the model's predictive distribution, whatever caused it -- so these arms and
# the style arms are directly comparable on the same axis.

information_rows: 256
evaluation_batch_size: 32

