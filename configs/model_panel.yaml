# One panel, two base models, five corpora.
#
# The negative this exists to confirm: across heterogeneous fine-tunes the rate
# a behaviour needs is not set by dataset size, likelihood gain, distributional
# shift, weight reconstruction error, or local curvature. Every one of those was
# measured on Mistral alone, so a second frozen substrate is the first thing
# that could overturn it -- and Tan et al. report that how much an adapter can
# write depends strongly on the substrate rather than on parameter count, which
# is exactly the axis this varies.
#
# Everything else is held: rank 16 all-linear, 8,000 rows, four epochs, the same
# seventeen rungs. Only the frozen model and the corpus move.
