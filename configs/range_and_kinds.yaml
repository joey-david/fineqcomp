version: 1

# Three additions, all aimed at the same weakness: the arms measured so far
# span only 0.50 to 0.66 held-out bits saved per token, so no curve can be
# fitted in that range and the code arm at 0.159 is judged by extrapolation.
#
#   budget_*   the same corpus at 500, 1,000, 4,000 and 8,000 optimizer
#              updates. Compute is deliberately not matched -- behavioural
#              change is the axis here, not a confound -- so one corpus spans
#              a wide range of change with content held exactly fixed.
#
#   kind_*     a base model has never produced assistant dialogue or
#              instruction following, so these are very large behavioural
#              changes carrying almost no factual content. The corrected
#              transform grid says magnitude and cost come apart; this is the
#              cleanest case of large change with little information.
#              GSM8K at 60 problems rides along as a retained-capability probe,
#              not as a task score.
#
#   code_long  Magicoder again at 2,048 tokens instead of 1,024. The +0.92
#              residual on code is the most interesting number we have and it
#              currently rests on a fine-tune scoring 0.03 to 0.11 on
#              HumanEval, which truncation is the obvious suspect for.

