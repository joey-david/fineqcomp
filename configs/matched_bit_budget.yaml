# Rank against precision at a matched bit budget, on corrupted-rationale LoRAs.
#
# The recorded recovery result compresses one finished rank-16 adapter and
# sweeps precision only, so "coarse codes discard the memorised noise" and
# "any small update would do" both predict it. Rank and precision are
# commensurable -- the file shrinks in proportion to both -- so `rank x bits`
# names a budget several adapters can meet, and the diagonals of this grid are
# the comparison the recorded result is missing: r16 at 1 bit, r8 at 2, r4 at 4,
# r2 at 8 and r1 at 16 all spend 16 units. Flat accuracy along a diagonal means
# only the size mattered; a slope means the split does.
#
# Three kinds of arm sit on the same axis:
#   permuted_r16   the adapter the recorded result used, truncated and re-coded.
#   permuted_r1..8 adapters trained low-rank from the first optimizer step at
#                  full precision, so a small update that was never wide can be
#                  read against a small update that was cut down from one.
#   permuted_r32/64 more capacity to memorise the mismatched rationales, which
#                  is where the benefit should break if it breaks at all.
#
# Nothing here trains. The r16 arm was paid for by conditional_trace_rate.yaml;
# every other arm is trained by configs/low_rank_permuted.yaml and is named here
# by campaign and rank, not by run id, so an edited training config shows up as
# a missing adapter rather than as a silently mismatched comparison.
#
# All seven arms are declared, and they are far more than one submission's worth
# of generation. That is deliberate: they belong to one locked study with one
# grid and one report, and the sweep is launched in tranches by array index. An
# arm that has not been swept comes back as `missing` in the summary rather than
# quietly changing what the finished arms are compared against. The rank-16 arm
# needs no new training and carries the matched-budget diagonals by itself, so
# it is the tranche to run first.
version: 1

# The full grid. Cells above an arm's trained rank are clamped and de-duplicated
# at prepare time, so the r1 arm contributes five cells rather than thirty-five
# and the r16 arm is unaffected by ranks 32 and 64 being listed. Only the arms
# actually trained that wide pay for them.
ranks: [1, 2, 4, 8, 16, 32, 64]
bits: [1, 2, 4, 8, 16]

seeds: [11, 22, 33]

arms:
  permuted_r1:
    config: configs/low_rank_permuted.yaml
    study: permuted_low_rank
    model: qwen25_7b_base
    rank: 1
  permuted_r2:
    config: configs/low_rank_permuted.yaml
    study: permuted_low_rank
    model: qwen25_7b_base
    rank: 2
  permuted_r4:
    config: configs/low_rank_permuted.yaml
    study: permuted_low_rank
    model: qwen25_7b_base
    rank: 4
  permuted_r8:
    config: configs/low_rank_permuted.yaml
    study: permuted_low_rank
    model: qwen25_7b_base
    rank: 8
  permuted_r16:
    config: configs/conditional_trace_rate.yaml
    study: trace_permuted_full
    model: qwen25_7b_base
    rank: 16
  permuted_r32:
    config: configs/low_rank_permuted.yaml
    study: permuted_high_rank
    model: qwen25_7b_base
    rank: 32
  permuted_r64:
    config: configs/low_rank_permuted.yaml
    study: permuted_high_rank
    model: qwen25_7b_base
    rank: 64

# Which splits every grid cell is scored on. GSM8K alone: the grid is 25 cells
# on the widest arm, and adding Symbolic to each would add a 500-row generation
# pass per cell for a second reading of the same contrast. Both benchmarks are
# still scored for the base model and the raw adapter of every arm, which is
# where the comparison with the recorded table is made.
candidate_splits: [gsm8k]

# Corpora and scoring, copied from configs/spectral_recovery.yaml so the numbers
# land on the axis the recorded result used.
calibration_rows: 128
gsm8k_test_rows: 1319
symbolic_instances: [0, 1, 2, 3, 4]
symbolic_source: prepared/gsm-symbolic-source.jsonl
symbolic_sha256: 945055837b232bd9b56827b1e3a5aa019075f29e8ba4669d9a9df8b4439a291f
generation_batch_size: 32
max_new_tokens: 512
bootstrap_draws: 10000
analysis_seed: 9172026

# Rows for the throughput probe. Walltime is set by generation, so one timed
# pass on the raw corrupted adapter sizes the job before the grid is submitted.
probe_rows: 64
