# Low-rank permuted-rationale fine-tunes, trained from scratch at fp16.
#
# The recovery result compresses a *finished* rank-16 adapter: a LoRA trained
# on rationales paired with the wrong problem loses most of its GSM8K accuracy,
# and truncating that update to rank one and one bit puts the accuracy back
# above the base model. Compression is applied after training, so the result on
# its own cannot say whether the benefit comes from the compression step or
# simply from the update ending up small and low-rank. This file supplies the
# missing arm: adapters that are low-rank from the first optimizer step, stored
# at full precision, never compressed.
#
# Identity is copied verbatim from `conditional_trace_rate.yaml` -- same model,
# dataset revision, converter, rationale control, row caps, training key and
# seeds -- so the only field that differs from the trained rank-16 arm is the
# adapter rank. Change anything else above and the comparison stops being a
# rank comparison.
#
# Ranks 1, 2, 4 and 8 are the from-scratch counterparts of the truncation rungs
# the matched-budget grid sweeps on the rank-16 adapter. Rank 16 is not listed
# because `conditional_trace_rate.yaml` already trained it; re-declaring it here
# would either retrain a paid run or collide with its run id.
#
# Ranks 32 and 64 sit in a second study because they answer the other half of
# the question. The low ranks ask whether a small update reproduces the benefit
# of compressing a larger one; the high ranks ask where the benefit stops, by
# giving the permuted rationales more capacity to be memorised rather than
# less. Training cost is nearly flat in rank -- it is dominated by the forward
# and backward passes through the frozen 7B backbone -- so the two studies cost
# about the same per run and can be launched independently by name.
version: 1
information_rows: 256
evaluation_batch_size: 32
codecs:
  # fp16 only. These adapters are the uncompressed arm; every lossy rung in the
  # comparison comes from the matched-budget sweep, which re-encodes the stored
  # raw adapter rather than relying on what the campaign wrote.
  fp16: {method: uniform, bits: 16}
models:
  qwen25_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-7B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
adapters:
  all_linear_r1:
    method: full_lora
    rank: 1
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    # alpha/rank is held at 2 across every rank, matching the rank-16 arm's
    # 32/16. Holding alpha fixed instead would change the update scale by 16x
    # between the ends of the sweep and confound rank with learning rate.
    alpha: 2
    dropout: 0.0
  all_linear_r2:
    method: full_lora
    rank: 2
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 4
    dropout: 0.0
  all_linear_r4:
    method: full_lora
    rank: 4
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 8
    dropout: 0.0
  all_linear_r8:
    method: full_lora
    rank: 8
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 16
    dropout: 0.0
  all_linear_r32:
    method: full_lora
    rank: 32
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 64
    dropout: 0.0
  all_linear_r64:
    method: full_lora
    rank: 64
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 128
    dropout: 0.0
training:
  cot_full_1ep:
    epochs: 1
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
    label_span: all
datasets:
  cot_math_permuted:
    task_type: generative
    train_source:
      path: meta-math/MetaMathQA
      name: default
      revision: aa4f34d3d2d3231299b5b03d9b3e5a20da45aa18
      split: train
      converter: metamath
    answer_marker: 'The answer is:'
    rationale_control: permuted
    validation_rows: 256
    train_rows: 32000
    test_rows: 1319
    evaluations:
    - key: gsm8k
      path: openai/gsm8k
      name: main
      revision: 740312add88f781978c0658806c59bc2815b9866
      split: test
      converter: gsm8k
    screening_metric: exact_match
    # The permuted arm is expected to fall far below the base model, so the
    # screening gates that protect an acquisition study are the wrong shape
    # here. Both thresholds are copied from the rank-16 permuted arm so this
    # campaign screens on exactly the terms that one did.
    maximum_baseline_score: 0.85
    minimum_validation_nll_gain_bits_per_token: 0.02
studies:
  permuted_low_rank:
    kind: natural
    models: [qwen25_7b_base]
    datasets: [cot_math_permuted]
    seeds: [11, 22, 33]
    adapters: [all_linear_r1, all_linear_r2, all_linear_r4, all_linear_r8]
    training: cot_full_1ep
  permuted_high_rank:
    kind: natural
    models: [qwen25_7b_base]
    datasets: [cot_math_permuted]
    seeds: [11, 22, 33]
    adapters: [all_linear_r32, all_linear_r64]
    training: cot_full_1ep
