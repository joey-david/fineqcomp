# Breadth: how fast does each adapter decay as the task moves away from home?
#
# Distance 0 is GSM8K, the benchmark MetaMathQA is built from and the task both
# adapters were trained for. Distance 1 is the same task in other corpora.
# Distance 2 is still mathematics but harder or in multiple-choice form.
# Distance 3 is technical reasoning with no arithmetic. Distance 4 is everyday
# and linguistic reasoning. Distance 5 is a different modality altogether.
#
# The narrow panel found that a clean fine-tune significantly HURTS the frozen
# model on MATH-500 and ARC-Challenge, and that the compressed corrupted
# adapter beats it on exactly those two. Two probes is an anecdote; this is 71,
# and it spans the whole range rather than only the failures, so the question
# becomes a decay curve: the clean adapter should win at home and fall off
# fastest, the compressed one should give up some of that and fall off slower.
#
# Filters are chosen on reserved MetaMathQA rows. Nothing in this panel takes
# part in selecting what is tested on it.
#
# Probes carry 400 rows so the analysis can split each in half: whether the
# clean adapter hurts is decided on one half, the clean-versus-compressed
# comparison measured on the other. Deciding and comparing on the same rows
# would manufacture the result through regression to the mean.
version: 1
models:
  qwen25_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-7B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
adapters:
  all_linear_r16:
    method: full_lora
    rank: 16
    alpha: 32
    dropout: 0.0
    last_n_layers: null
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
training:
  cot_full_1ep:
    epochs: 1
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 400
    restore_best: false
    label_span: all
codecs:
  fp16: {method: uniform, bits: 16, score_task: false}
datasets:
  cot_math: &cot
    task_type: generative
    train_source:
      path: meta-math/MetaMathQA
      name: default
      revision: aa4f34d3d2d3231299b5b03d9b3e5a20da45aa18
      split: train
      converter: metamath
    answer_marker: 'The answer is:'
    # The adopted adapters trained on rows 256..32256 of this exact seed-11
    # shuffle. Excluding every seed problem occurring in that slice leaves 3,025
    # untouched ones to draw reserved rows from, so a filter is chosen on rows
    # these adapters provably never saw. (The original study's own 256-row
    # validation set was not: only 23 of its rows had an unseen seed problem.)
    holdout_by_group: true
    holdout_excludes_first_rows: 32256
    validation_rows: 256
    train_rows: 32000
    test_rows: 500
    evaluations:
      - key: gsm8k
        path: openai/gsm8k
        name: main
        revision: 740312add88f781978c0658806c59bc2815b9866
        split: test
        converter: gsm8k
    screening_metric: exact_match
    maximum_baseline_score: 0.85
    minimum_validation_nll_gain_bits_per_token: 0.0
  cot_math_permuted:
    <<: *cot
    rationale_control: permuted
studies:
  regimes_clean:
    kind: natural
    models: [qwen25_7b_base]
    datasets: [cot_math]
    seeds: [11]
    adapters: [all_linear_r16]
    training: cot_full_1ep
  regimes_permuted:
    kind: natural
    models: [qwen25_7b_base]
    datasets: [cot_math_permuted]
    seeds: [11]
    adapters: [all_linear_r16]
    training: cot_full_1ep
spectral_transfer:
  seed: 11
  arms: {clean: regimes_clean, permuted: regimes_permuted}
  # Fine at the top, where the hypothesis says the regimes divide, and coarse
  # in the tail, where it predicts nothing interesting happens.
  edges: [0, 1, 2, 4, 8, 16]
  codes:
    # fp16 is the regime axis: pure band selection, no coding confound.
    fp16: {bits: 16}
    two_bit: {bits: 2}
    binary: {bits: 1}
  scales: [0.1, 0.3, 0.5]
  fixed_bands: [[0, 1], [1, 4], [4, 16]]
  # 256 reserved rows, all of them held out of the adopted adapters' training.
  training_validation_rows: 0
  search_rows: 128
  selection_rows: 128
  finalists_per_family: 2
  generation_batch_size: 32
  max_new_tokens: 512
  evaluation_chunk_rows: 128
  bootstrap_draws: 10000
  analysis_seed: 9212026
  claim_gates:
    coded_family: filter
    transfer_family: math
    minimum_corruption_harm: 0.05
    equivalence_width: 0.10
    minimum_in_family_datasets: 2
  primary:
