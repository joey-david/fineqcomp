# Does the reversal at 14B and 32B come from scale, or from the ceiling?
#
# On GSM8K the overshoot peaks at 3B (+10.6) and goes negative by 14B (-2.2) and
# 32B (-4.2). But those models start at 84.0% and 91.0%, so there is almost no
# room above them: the reversal may be a ceiling artefact rather than anything
# about scale.
#
# This study holds scale large and moves base competence instead. The three
# corpora here are ones the same family is weak on -- 11.8%, 18.6% and 29.8% at
# 7B -- and all three are format shifts: the model has to emit SQL, XBRL tags or
# one terse sentence, none of which its pretraining prior produces. That matters
# because the mechanism study found that what survives compression is a format
# prior, so the prediction is not merely "more headroom, more gain" but that the
# gain is largest exactly where the base model's failure is a failure of form.
#
# The corruption is a mismatched response -- the whole answer dealt to a
# different question. The pointer arms showed that permuted working leaves a
# recoverable answer and so does not damage; this cannot be shortcut.
#
# Prediction: overshoot returns at 14B and 32B here, and tracks base competence
# rather than parameter count.
adapters:
  all_linear_r16:
    alpha: 32
    dropout: 0.0
    last_n_layers: null
    method: full_lora
    rank: 16
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
codecs:
  binary:
    bits: 1
    method: uniform
datasets:
