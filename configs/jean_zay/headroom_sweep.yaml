# Nine cells: three tasks the family is weak on, crossed with 7B, 14B, 32B.
# Tests whether the GSM8K reversal at 14B/32B is about scale or about a ceiling.
arms:
  sql_14b:
    config: configs/jean_zay/headroom.yaml
    dataset: sql_mismatched
    evaluator: text_to_sql
    max_new_tokens: 128
    model: qwen25_14b_base
    rank: 16
    study: headroom_ladder
  sql_32b:
    config: configs/jean_zay/headroom.yaml
    dataset: sql_mismatched
