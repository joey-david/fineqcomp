# Predicting the bit budget of a fine-tune before running it.
#
# Freeze this file before reading any budget. Everything below the gates was
# written before a single cell of the new target was computed.
#
# ---------------------------------------------------------------------------
# What is being measured, and why it is not what was measured before
#
# The target is B*, the smallest adapter file in bits that still keeps 90% of
# the held-out likelihood gain the finished fine-tune reached, minimised over
# the whole rank-by-precision surface with informed truncation. The campaign's
# existing R* is a slice of that surface at one rank, on a ladder that below
# one bit drops a *random* subset of LoRA directions (`codec.blend_widths` at
# zero bits, keyed on the pair name so it cannot look at the weights). Almost
# every recorded R* lies between 0.2 and 1.2 bits per value, so almost every
# one of them scores random rank pruning rather than a bit budget, and informed
# truncation beats that mask by a median of 28 retained-gain points on the very
# same files. B* is what "how many bits does this behaviour need" means once
# the allocator is allowed to see the weights.
#
# The predictor is not a scalar summary of a gradient spectrum. Forty-six such
# candidates have been screened on this campaign; the locked one failed its
# prospective test, and the audit showed why -- a corpus statistic takes the
# same value on every receiver, so it can only be graded on the corpus axis,
# and the sign of its relation to R* flips between the within-receiver and the
# across-receiver comparison. Here the predictor is the same measurement on an
# adapter that was never trained: cap the optimizer at k updates over a 256-row
# batch, rescale the resulting update along its own direction to the best point
# on the held-out split, and sweep that adapter over the identical surface.
#
# The prediction is B*_probe == B*_trained on the identity line. There is no
# fitted constant, no receiver intercept and no ranking step, so the same
# prediction can be made for a receiver and a corpus that nothing was fitted on.
#
# ---------------------------------------------------------------------------
# Stages, in the order they run
#
#   probes   train the capped runs. One update over a 256-row batch, or eight
#            for the ladder. Nothing here is a fine-tune.
#   sweep    the budget surface of every probe and of the finished adapters
#            they predict. No training at all: the targets are runs the
#            campaign has already paid for.
#   report   join the two and read the gates.
#
# The whole study fits in ten GPU-hours because it trains nothing at full
# length. What that buys is thirty paired cells over seven receivers and six
# corpora; what it does not buy is a receiver the campaign has never fine-tuned,
# which is the next thing to spend on if the gates below hold.
#
# ---------------------------------------------------------------------------
# Pre-registered gates
#
#   P1  At least 90% of swept adapters have a bracketed budget: a point on the
#       envelope on each side of the 90% crossing. An extrapolated budget is a
#       number the sweep did not measure and is read by nothing downstream.
#   P2  The probe orders the arms: Spearman of B*_probe against B*_trained is
#       at least 0.60 at some probe budget. Below that the construction has no
#       signal and the identity line cannot be worth reading.
#   P3  The probe beats the corpus mean on the identity line: its RMSE in bits
#       per value is at most 0.75 of the error made by predicting each arm from
#       the mean of the other receivers on the same corpus. That baseline is
#       what someone who measured nothing would say, and it is the one every
#       corpus statistic was implicitly fitted to.
#   P4  The probe orders receivers inside a corpus with sign accuracy at least
#       0.70 over receiver pairs. This is the axis a corpus statistic cannot
#       score on at all, and the axis the campaign's claim lives on.
#
# P1 failing means the sweep grid is wrong and nothing else can be read. P2
# failing kills the construction. P2 passing with P3 failing means the probe
# ranks but does not predict, which is the same failure the correction-spectrum
# measures had and would have to be reported as such. P4 is the claim.
#
# There is no separate prospective stage, and none is needed to keep the test
# honest: the predictor has no fitted parameters, no receiver term and no
# ranking step, so there is nothing for a development set to leak into it. What
# has to stay locked is this file, and it is locked before any probe exists.
# The claim a passing panel supports is that the construction predicts on the
# receivers and corpora measured here; extending it to a receiver nobody has
# fine-tuned needs those runs, which this budget does not have.

version: 1
information_rows: 256
evaluation_batch_size: 32

gates:
  bracketed_share: 0.90
  probe_spearman: 0.60
  identity_over_corpus_mean: 0.75
  receiver_sign_accuracy: 0.70

# The budget sweep supplies its own rank-by-precision grid, so a run only needs
# enough of the shipped ladder to place its own uncoded gain and to keep the
# pipeline's contract. `raw` scores the task once; the rest of the rate axis is
# the sweep's job.
codecs:
  uniform2: {method: uniform, bits: 2}
  binary: {method: uniform, bits: 1, score_task: false}

models:
  # Seven development receivers, carried over unchanged from the transposed
  # panel so their finished adapters can be swept without retraining.
  mistral_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/mistralai/Mistral-7B-v0.1
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  llama31_8b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/meta-llama/Llama-3.1-8B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  qwen25_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-7B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  qwen3_8b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen3-8B-Base
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  qwen25_math_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-Math-7B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  gemma2_9b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/google/gemma-2-9b
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  gemma2_9b_instruct:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/google/gemma-2-9b-it
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
# Every target was trained in this container, so every probe is scored in it,
# whatever container the probe itself was built in.
target_adapter: all_linear_r16

adapters:
  all_linear_r16:
    method: full_lora
    rank: 16
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 32
    dropout: 0.0
  # A probe container only. One update moves B and not A, because the gradient
  # with respect to A is zero while B is zero, so the probe's correction is a
  # random sketch of the real one into as many dimensions as the container has.
  # Sixteen is too few: the sketch comes out well conditioned where a trained
  # pair is concentrated, and truncation punishes exactly that. Sketching into
  # sixty-four and cutting back to sixteen keeps the estimate and drops the
  # width, so the budget stays a file of the same kind.
  probe_wide_r64:
    method: full_lora
    rank: 64
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 128
    dropout: 0.0
training:
  # The shared contract, copied unchanged from the transposed panel so the
  # finished development targets are the runs this file describes.
  panel_4ep: &panel_4ep
    epochs: 4
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
  # The probes. One update over a 256-row batch is one accumulated gradient at
  # the frozen weights, which is the correction the corpus asks this model for
  # before anything has been learned. Warmup is off because a warmed-up first
  # step is no step at all, best-state restore is off because the probe is the
  # state at exactly k updates and not a maximum over checkpoints, and the
  # magnitude is left to the scale search rather than to the learning rate.
  probe_1: &probe_1
    epochs: 4
    learning_rate: 0.0002
    effective_batch_size: 256
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.0
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: null
    max_updates: 1
    restore_best: false
  probe_8:
    <<: *probe_1
    max_updates: 8

datasets:
  # The three development corpora, byte-identical to the transposed panel so
  # the frozen baselines and the prepared splits are shared rather than remade.
  kind_code:
    task_type: generative
    train_source: {path: ise-uiuc/Magicoder-Evol-Instruct-110K, name: default, revision: b0079beaa0361d82412520b873715bee59cc7dd4, split: train, converter: magicoder}
    validation_rows: 256
    train_rows: 8000
    test_rows: 164
    evaluations:
    - {key: humaneval, path: openai/openai_humaneval, name: openai_humaneval, revision: 7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544, split: test, converter: humaneval}
    screening_metric: pass_at_1
    maximum_baseline_score: 0.75
    minimum_validation_nll_gain_bits_per_token: 0.02
  panel_math:
    task_type: generative
    train_source: {path: meta-math/MetaMathQA, name: default, revision: aa4f34d3d2d3231299b5b03d9b3e5a20da45aa18, split: train, converter: metamath}
    validation_rows: 256
    train_rows: 8000
    test_rows: 1319
    evaluations:
    - {key: gsm8k, path: openai/gsm8k, name: main, revision: 740312add88f781978c0658806c59bc2815b9866, split: test, converter: gsm8k}
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
  xbrl_tags:
    task_type: generative
    train_source: {path: wangd12/XBRL_analysis, name: tags, revision: 6ee79f739a6c51d4ec39921693ee3d7e0cd54c17, split: train, converter: xbrl_tags}
    validation_rows: 256
    train_rows: 8000
    test_rows: 500
    evaluations:
    - {key: xbrl_tags, path: wangd12/XBRL_analysis, name: tags, revision: 6ee79f739a6c51d4ec39921693ee3d7e0cd54c17, split: test, converter: xbrl_tags}
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
  # Three more corpora, chosen because Mistral and Qwen2.5 already have
  # finished adapters for them: summarisation, dialogue preference and
  # text-to-SQL. None is code, mathematics or tag extraction, so the corpus
  # axis is six task shapes wide rather than three.
  kind_summary:
    task_type: generative
    screening_binomial: false
    train_source: {path: EdinburghNLP/xsum, name: default, revision: 7d4d486c2f8ef850b1a11aead99b894ff3dd7da9, split: train, converter: xsum}
    validation_rows: 256
    train_rows: 8000
    test_rows: 500
    evaluations:
    - {key: xsum, path: EdinburghNLP/xsum, name: default, revision: 7d4d486c2f8ef850b1a11aead99b894ff3dd7da9, split: test, converter: xsum}
    screening_metric: rouge_l
    maximum_baseline_score: 0.45
    minimum_validation_nll_gain_bits_per_token: 0.02
  kind_dialogue:
    task_type: generative
    train_source: {path: Anthropic/hh-rlhf, name: default, revision: 09be8c5bbc57cb3887f3a9732ad6aa7ec602a1fa, split: train, converter: hh_rlhf}
    validation_rows: 256
    train_rows: 8000
    test_rows: 60
    evaluations:
    - {key: gsm8k, path: openai/gsm8k, name: main, revision: 740312add88f781978c0658806c59bc2815b9866, split: test, converter: gsm8k}
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02

  text_to_sql:
    task_type: generative
    train_source: {path: gretelai/synthetic_text_to_sql, name: default, revision: 740ab236e64503fba51be1101df7a1be83bf455d, split: train, converter: text_to_sql}
    validation_rows: 256
    train_rows: 8000
    test_rows: 500
    evaluations:
    - {key: text_to_sql, path: gretelai/synthetic_text_to_sql, name: default, revision: 740ab236e64503fba51be1101df7a1be83bf455d, split: test, converter: text_to_sql}
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02

studies:
  # Nothing here trains for longer than sixty-four optimizer updates. Every
  # target this panel predicts is an adapter that already exists on the shared
  # store, so the budget buys probes and sweeps and no new fine-tuning.
  #
  # The core: the transposed receiver panel, one seed. Seven receivers on three
  # corpora, including both pairs a corpus statistic cannot tell apart.
  probe1_core:
    kind: natural
    models: &development
    - mistral_7b_base
    - llama31_8b_base
    - qwen25_7b_base
    - qwen3_8b_base
    - qwen25_math_7b_base
    - gemma2_9b_base
    - gemma2_9b_instruct
    datasets: [kind_code, xbrl_tags]
    seeds: [11]
    adapters: &container [all_linear_r16]
    training: probe_1
  # Mathematics carries six of the seven. Qwen3-8B already answers GSM8K above
  # the campaign's saturation threshold, so the transposed panel screened it out
  # at every seed and there is no finished adapter on that cell for a probe to
  # predict. Asking for it anyway would be asking for a target that cannot
  # exist, not discovering one that is missing.
  probe1_math:
    kind: natural
    models:
    - mistral_7b_base
    - llama31_8b_base
    - qwen25_7b_base
    - qwen25_math_7b_base
    - gemma2_9b_base
    - gemma2_9b_instruct
    datasets: [panel_math]
    seeds: [11]
    adapters: *container
    training: probe_1
  # Three more corpora on the two receivers that already have finished adapters
  # for them, so the corpus axis is six wide and not three.
  probe1_wide:
    kind: natural
    models: [mistral_7b_base, qwen25_7b_base]
    datasets: [kind_summary, kind_dialogue, text_to_sql]
    seeds: [11]
    adapters: *container
    training: probe_1
  # Is any of this reproducible? Same cells, a different seed, on the cheapest
  # corpus. Without this the panel cannot say whether a budget is a measurement
  # or a draw.
  probe1_replicate:
    kind: natural
    models: &replicates [mistral_7b_base, qwen25_7b_base, gemma2_9b_base]
    datasets: [xbrl_tags]
    seeds: [22]
    adapters: *container
    training: probe_1
  # How much of the answer is in the first update. The targets are already swept
  # by the core stage, so this costs three probes.
  probe8_ladder:
    kind: natural
    models: *replicates
    datasets: [xbrl_tags]
    seeds: [11]
    adapters: *container
    training: probe_8
  # The repair, piloted on the two receivers that bracket the failure: Mistral
  # over-predicted by 1.6x and Qwen2.5-Math by 4.4x on this corpus.
  probe1_wide_container:
    kind: natural
    models: [mistral_7b_base, qwen25_math_7b_base]
    datasets: [kind_code]
    seeds: [11]
    adapters: [probe_wide_r64]
    training: probe_1
