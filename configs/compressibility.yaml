version: 1

# Experiment 2: does the adapter bit-budget track dataset information?
#
# Four arms at fixed compute — 2000 optimizer updates, 32000 samples seen — so
# tokens, steps and schedule are identical and the only difference is how many
# of those samples are distinct. Duplication is the axis, not a side control.
#
# If R*(0.90) rises across the arms it tracks unique information; if it is flat
# it tracks training volume and the hypothesis fails.

information_rows: 256
evaluation_batch_size: 32

# Rungs at 1.0/1.25/1.5/1.75/2.0 because R*(0.90) fell in the whole-bit gap
# between 85.7% and 98.6% retention, which no whole-bit ladder can resolve.
# fp16 anchors the raw reference; 3 and 4 bits close the top of the curve.
codecs:
  fp16:
    method: uniform
    bits: 16
  uniform4:
    method: uniform
    bits: 4
  uniform3:
    method: uniform
    bits: 3
  uniform2:
    method: uniform
    bits: 2
  blend1_75:
    method: uniform
    bits: 1
    blend: 0.75
  blend1_50:
    method: uniform
    bits: 1
    blend: 0.5
  blend1_25:
    method: uniform
    bits: 1
    blend: 0.25
  binary:
    method: uniform
    bits: 1

models:
  mistral_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/mistralai/Mistral-7B-v0.1
    revision: dsdir-shared-store
    backbone: nf4
    chat: false

  qwen25_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-7B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false

adapters:
  all_linear_r16:
    method: full_lora
    rank: 16
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 32
    dropout: 0.0

training:
  arm_a_8ep:
    epochs: 8
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
  arm_b_4ep:
    epochs: 4
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
  arm_c_2ep:
    epochs: 2
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
  arm_d_1ep:
    epochs: 1
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200

datasets:
  arm_a:
