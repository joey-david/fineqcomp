version: 1

# Experiment 2: does the adapter bit-budget track dataset information?
#
# Four arms at fixed compute — 2000 optimizer updates, 32000 samples seen — so
# tokens, steps and schedule are identical and the only difference is how many
# of those samples are distinct. Duplication is the axis, not a side control.
#
# If R*(0.90) rises across the arms it tracks unique information; if it is flat
# it tracks training volume and the hypothesis fails.

information_rows: 256
evaluation_batch_size: 32

# Rungs at 1.0/1.25/1.5/1.75/2.0 because R*(0.90) fell in the whole-bit gap
# between 85.7% and 98.6% retention, which no whole-bit ladder can resolve.
# Nothing above two bits: the overnight run put retention at 99% there, so
# those rungs cost 19 minutes each and carry no information about the
# crossing. The raw adapter is scored anyway and supplies the denominator.
# Add them later from the cached checkpoint if the full curve is wanted.
#
# The first pass then found the opposite problem. One bit still held 90% of the
# gain in every arm on held-out bits saved, and in three of five on accuracy,
# so R*(0.90) was pinned to the bottom rung and reported the same 1.02 bits for
# every arm — a censored measurement, not a flat result. The rungs below one
# bit keep `blend` of the sixteen rank directions at one bit and drop the rest,
# so the rate is the fraction kept. Sixteen rows means the reachable rates are
# multiples of 1/16, and these are k = 14, 12, 10, 8, 6, 4, 3, 2, 1.
#
# Only the 0.5-bit rung is scored on the test set. The others measure held-out
# bits saved, which is a forward pass over 256 rows instead of 1,319 generated
# answers, and that is the axis the arms are compared on; the anchor is there
# to check the two axes still order the arms the same way this far down. It
# is written last so a job that runs out of time still leaves a whole
# bits-saved ladder behind.
codecs:
  uniform2:
    method: uniform
    bits: 2
  blend1_75:
    method: uniform
    bits: 1
    blend: 0.75
  blend1_50:
    method: uniform
    bits: 1
    blend: 0.5
  blend1_25:
    method: uniform
    bits: 1
    blend: 0.25
  binary:
    method: uniform
    bits: 1
  sub0_875:
    method: uniform
    bits: 0
    blend: 0.875
    score_task: false
  sub0_750:
    method: uniform
    bits: 0
    blend: 0.75
    score_task: false
  sub0_625:
    method: uniform
    bits: 0
    blend: 0.625
    score_task: false
  sub0_375:
    method: uniform
    bits: 0
    blend: 0.375
    score_task: false
  sub0_250:
    method: uniform
    bits: 0
    blend: 0.25
    score_task: false
  sub0_1875:
    method: uniform
    bits: 0
    blend: 0.1875
    score_task: false
  sub0_125:
    method: uniform
    bits: 0
    blend: 0.125
    score_task: false
  sub0_0625:
    method: uniform
    bits: 0
    blend: 0.0625
    score_task: false
  sub0_500:
    method: uniform
    bits: 0
    blend: 0.5

models:
  mistral_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/mistralai/Mistral-7B-v0.1
    revision: dsdir-shared-store
    backbone: nf4
    chat: false

  qwen25_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-7B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false

adapters:
  all_linear_r16:
    method: full_lora
    rank: 16
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 32
    dropout: 0.0

  # Same placement at a quarter and four times the rank, for the information
  # study's question of whether R* is task content or the cost of naming a
  # point in weight space. No study in this file uses them.
  all_linear_r4:
    method: full_lora
    rank: 4
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 8
    dropout: 0.0

  all_linear_r64:
    method: full_lora
    rank: 64
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 128
    dropout: 0.0

training:
  arm_e_16ep:
    epochs: 16
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
  arm_a_8ep:
