# Locked replacement for the Qwen3 GSM8K arm, whose base model crossed the
# predeclared saturation screen before training. PAWS is absent from the
# channel-rate development panel and has enough rows for the fixed measurement.
version: 1
information_rows: 256
evaluation_batch_size: 32
codecs:
  uniform2: {method: uniform, bits: 2}
  blend1_50: {method: uniform, bits: 1, blend: 0.5}
  binary: {method: uniform, bits: 1}
  sub0_14_16: {method: uniform, bits: 0, blend: 0.875, score_task: false}
  sub0_13_16: {method: uniform, bits: 0, blend: 0.8125, score_task: false}
  sub0_12_16: {method: uniform, bits: 0, blend: 0.75, score_task: false}
  sub0_11_16: {method: uniform, bits: 0, blend: 0.6875, score_task: false}
  sub0_10_16: {method: uniform, bits: 0, blend: 0.625, score_task: false}
  sub0_09_16: {method: uniform, bits: 0, blend: 0.5625, score_task: false}
  sub0_08_16: {method: uniform, bits: 0, blend: 0.5}
  sub0_07_16: {method: uniform, bits: 0, blend: 0.4375, score_task: false}
  sub0_06_16: {method: uniform, bits: 0, blend: 0.375, score_task: false}
  sub0_05_16: {method: uniform, bits: 0, blend: 0.3125, score_task: false}
  sub0_04_16: {method: uniform, bits: 0, blend: 0.25, score_task: false}
  sub0_03_16: {method: uniform, bits: 0, blend: 0.1875, score_task: false}
  sub0_02_16: {method: uniform, bits: 0, blend: 0.125, score_task: false}
  sub0_01_16: {method: uniform, bits: 0, blend: 0.0625, score_task: false}
models:
  qwen3_8b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen3-8B-Base
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
adapters:
  all_linear_r16:
    method: full_lora
    rank: 16
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 32
    dropout: 0.0
training:
  panel_4ep:
    epochs: 4
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
datasets:
  paws_channel:
    task_type: generative
    train_source:
      path: google-research-datasets/paws
      name: labeled_final
      revision: 161ece9501cf0a11f3e48bd356eaa82de46d6a09
      split: train
      converter: paws
    validation_rows: 256
    train_rows: 8000
    test_rows: 1000
    evaluations:
      - key: paws
        path: google-research-datasets/paws
        name: labeled_final
        revision: 161ece9501cf0a11f3e48bd356eaa82de46d6a09
        split: test
        converter: paws
    screening_metric: exact_match
    maximum_baseline_score: 0.9
    minimum_validation_nll_gain_bits_per_token: 0.02
studies:
  qwen3_paws:
    kind: natural
    models: [qwen3_8b_base]
    datasets: [paws_channel]
    seeds: [11, 22, 33]
    adapters: [all_linear_r16]
    training: panel_4ep
