# Parser, token, and two-row training checks for newer reasoning trace sources.
# Only these small caps may run until each data and model gate is recorded.
version: 1
information_rows: 64
evaluation_batch_size: 1
codecs:
  binary: {method: uniform, bits: 1}
models:
  r1_distill_qwen_1_5b:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
    revision: ad9f0ae0864d7fbcd1cd905e3c6c5b069cc8b562
    backbone: nf4
    chat: true
adapters:
  all_linear_r16:
    method: full_lora
    rank: 16
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    last_n_layers: null
    alpha: 32
    dropout: 0.0
training:
  data_contract:
    epochs: 1
    learning_rate: 0.0002
    effective_batch_size: 1
    micro_batch_size: 1
    max_length: 4096
    warmup_ratio: 0.0
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    restore_best: false
    label_span: all
datasets:
  numina_math_cot_smoke:
    task_type: generative
    train_source:
      path: AI-MO/NuminaMath-CoT
      name: default
      revision: 9d8d210c9f6a36c8f3cd84045668c9b7800ef517
      split: train
      converter: math
    answer_marker: '\boxed{'
    validation_rows: 64
    train_rows: 128
    test_rows: 64
    evaluations:
    - key: math
      path: HuggingFaceH4/MATH-500
      name: default
      revision: 6e4ed1a2a79af7d8630a6b768ec859cb5af4d3be
      split: test
      converter: math
    screening_metric: exact_match
    maximum_baseline_score: 0.95
    minimum_validation_nll_gain_bits_per_token: 0.02
  openr1_math_smoke:
    task_type: generative
    train_source:
      path: open-r1/OpenR1-Math-220k
      name: default
      revision: e4e141ec9dea9f8326f4d347be56105859b2bd68
      split: train
      converter: openr1_math
    answer_marker: '</think>'
    validation_rows: 64
    train_rows: 128
    test_rows: 64
    evaluations:
    - key: math
      path: HuggingFaceH4/MATH-500
      name: default
      revision: 6e4ed1a2a79af7d8630a6b768ec859cb5af4d3be
      split: test
      converter: math
    screening_metric: exact_match
    maximum_baseline_score: 0.95
    minimum_validation_nll_gain_bits_per_token: 0.02
studies:
  numina_data_contract:
    kind: natural
    models: [r1_distill_qwen_1_5b]
    datasets: [numina_math_cot_smoke]
    seeds: [11]
    adapters: [all_linear_r16]
    training: data_contract
  openr1_data_contract:
    kind: natural
    models: [r1_distill_qwen_1_5b]
    datasets: [openr1_math_smoke]
    seeds: [11]
    adapters: [all_linear_r16]
    training: data_contract
