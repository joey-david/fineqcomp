# The span-supervision split, repeated on a second frozen model.
#
# On Mistral the reasoning span costs 1.07 bits per value to keep at ninety per
# cent and the answer format 0.58, and each supervision target damages the span
# it does not cover -- answer-only supervision leaves GSM8K below the untuned
# base model. Both halves of that are single-substrate results, and the
# two-model panel has just shown that the corpus ordering does not survive a
# change of frozen model, so neither can be stated until this runs.
version: 1
information_rows: 256
evaluation_batch_size: 32
codecs:
  uniform2:
    method: uniform
    bits: 2
  blend1_75:
    method: uniform
    bits: 1
    blend: 0.75
  blend1_50:
    method: uniform
    bits: 1
    blend: 0.5
  blend1_25:
    method: uniform
    bits: 1
    blend: 0.25
  binary:
    method: uniform
    bits: 1
  sub0_875:
    method: uniform
    bits: 0
    blend: 0.875
    score_task: false
  sub0_750:
    method: uniform
    bits: 0
    blend: 0.75
    score_task: false
  sub0_625:
    method: uniform
    bits: 0
    blend: 0.625
    score_task: false
  sub0_375:
    method: uniform
    bits: 0
    blend: 0.375
    score_task: false
  sub0_250:
    method: uniform
    bits: 0
    blend: 0.25
    score_task: false
  sub0_1875:
    method: uniform
    bits: 0
    blend: 0.1875
    score_task: false
  sub0_125:
    method: uniform
    bits: 0
    blend: 0.125
    score_task: false
  sub0_0625:
    method: uniform
    bits: 0
    blend: 0.0625
    score_task: false
  sub0_500:
    method: uniform
    bits: 0
    blend: 0.5
    score_task: false
models:
  mistral_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/mistralai/Mistral-7B-v0.1
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  qwen25_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-7B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
adapters:
  all_linear_r16:
    method: full_lora
    rank: 16
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    last_n_layers: null
    alpha: 32
    dropout: 0.0
training:
  cot_full_1ep:
    epochs: 1
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
    label_span: all
  cot_reasoning_1ep:
    epochs: 1
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
    label_span: reasoning
  cot_answer_1ep:
    epochs: 1
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
    label_span: answer
datasets:
  cot_math:
    task_type: generative
    train_source:
      path: meta-math/MetaMathQA
      name: default
      revision: aa4f34d3d2d3231299b5b03d9b3e5a20da45aa18
      split: train
      converter: metamath
    answer_marker: 'The answer is:'
    validation_rows: 256
    train_rows: 32000
    test_rows: 1319
    evaluations:
    - key: gsm8k
      path: openai/gsm8k
      name: main
      revision: 740312add88f781978c0658806c59bc2815b9866
      split: test
      converter: gsm8k
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
studies:
  sup_full:
    kind: natural
    models:
    - mistral_7b_base
    datasets: &id001
    - cot_math
    seeds: &id002
    - 11
    - 22
    - 33
    adapters: &id003
    - all_linear_r16
    training: cot_full_1ep
  sup_reasoning:
    kind: natural
    models:
    - mistral_7b_base
    datasets: &id004
    - cot_math
    seeds: &id005
    - 11
    - 22
    - 33
    adapters: &id006
    - all_linear_r16
    training: cot_reasoning_1ep
  sup_answer:
    kind: natural
    models:
    - mistral_7b_base
    datasets: &id007
    - cot_math
    seeds: &id008
    - 11
    - 22
    - 33
    adapters: &id009
    - all_linear_r16
    training: cot_answer_1ep
  qwen_sup_full:
    kind: natural
    models:
    - qwen25_7b_base
    datasets: *id001
    seeds: *id002
    adapters: *id003
    training: cot_full_1ep
  qwen_sup_reasoning:
    kind: natural
    models:
    - qwen25_7b_base
    datasets: *id004
    seeds: *id005
    adapters: *id006
    training: cot_reasoning_1ep
  qwen_sup_answer:
    kind: natural
    models:
    - qwen25_7b_base
    datasets: *id007
    seeds: *id008
    adapters: *id009
    training: cot_answer_1ep
