version: 1

# Are adapter bits set by the size of the behavioural change, or by the data?
#
# Experiment 2 cannot say. Its R*(0.90) asks each arm for ninety percent of its
# own gain, and those targets rise with unique rows (0.479 to 0.582 bits per
# token), so "more informative data" and "larger behavioural change" are
# collinear. Both fit the same fifteen runs: R2 0.733 against the target,
# 0.706 against log rows. See results/adapter_bits_follow_behavioural_change.
#
# This grid breaks the collinearity by crossing two levers.
#
#   response_transform      moves behaviour at fixed information. The problems,
#                           the answers and the rows are identical; only how the
#                           response is written changes, and the final answer
#                           line survives every rewrite so scoring is unaffected.
#
#   distinct_source_problems  moves information at fixed behaviour target. 8,000
#                           rows drawn from 400 seed problems or from all of
#                           them (about 5,620).
#
# Five transforms x two diversity levels x three seeds = 30 runs, all
# compute-matched at 2,000 updates and 32,000 samples seen.
#
# Pre-registered predictions are in the results folder named above. In short:
# every arm should fall on one curve of file size against achieved behavioural
# change; R* should rise across transforms and stay flat across diversity.
#
# The ladder is denser than the campaign's between a third and seven eighths of
# a bit, because that is where the crossings fall: on Experiment 2 the arms
# reached 0.30 bits per token at 16.7 Mbit and 0.50 at 27 to 32 Mbit, which is
# 0.40 to 0.77 bits per value.

information_rows: 256
evaluation_batch_size: 32

codecs:
  uniform2:
    method: uniform
    bits: 2
  blend1_50:
