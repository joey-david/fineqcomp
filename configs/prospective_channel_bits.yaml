adapters:
  all_linear_r16:
    method: full_lora
    rank: 16
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    last_n_layers: null
    alpha: 32
    dropout: 0.0
training:
  panel_4ep:
    epochs: 4
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
datasets:
