# Prospective test of the correction channel rate.
#
# The measure and its one knob were fixed on the 54-arm discovery panel before
# this file was written: the rate of the frozen model's correction spectrum
# against a noise floor at one hundredth of its own mean eigenvalue. Nothing
# below is used to choose either.
#
# Three things are new here and each can falsify the measure on its own.
# GSM8K is a corpus no arm in the screen used, and it runs on all four
# receivers. Text-to-SQL and XBRL run on Llama and Qwen3, the two receivers
# that had no structured task, which is the leave-one-model-out case where the
# measure has to carry the level of R* and not just its order. The XBRL
# diversity lever runs on a third receiver, and that is the gate the measure
# currently fails: it agrees with the direction of R* in two of four families
# where response redundancy agrees in four.
#
# Every dataset here is already staged under prepared/natural for seeds
# 11, 22 and 33, so the manifest is written with --no-data and no run touches
# the Hub.
version: 1
information_rows: 256
evaluation_batch_size: 32
codecs:
  uniform2:
    method: uniform
    bits: 2
  blend1_50:
    method: uniform
    bits: 1
    blend: 0.5
  binary:
