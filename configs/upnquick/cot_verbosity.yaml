# How the recovered adapter beats the base model, and whether it is verbosity.
#
# Reads the damaged adapter identified by the denoise study's lock rather than
# re-declaring it, so this study cannot drift onto a different adapter than the
# one whose behaviour it is explaining.
# The recovered update: rank one through a real one-bit file, which is the
# condition that scores 80.2% against the base model's 74.8%.
# Floors on the chain, in generated tokens, for the forcing experiment. The
# base model's own chain runs about 90 tokens before the answer marker and the
# adapter's about 130, so this brackets both and extends past them.
# Layer bands for the localisation experiment. Qwen2.5-7B has 28 layers, so
# four bands are seven layers each.
# The teacher-forced readout. 128 chains is enough to separate a shift of a few
# hundredths of a nat per position, and each is a single forward pass.
# Corpora and scoring, copied from configs/upnquick/denoise_vs_shrinkage.yaml
# so every accuracy here lands on the recorded axis.
