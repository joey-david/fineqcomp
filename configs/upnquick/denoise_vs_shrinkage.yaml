# Denoising or shrinkage? The control the matched-budget grid is missing.
#
# `reports/matched_bit_budget_upnquick/RESULTS.md` closes by naming the one
# comparison that could overturn its mechanistic reading: quantization changes
# an update's magnitude as well as its resolution, so a plain rescaling of the
# same damaged update might reproduce the recovery. This study runs that
# control on the same host, the same seed and the same 500 GSM8K rows, so its
# numbers drop straight onto the recorded axis.
#
# Nothing here trains except the aligned arm, and that arm is an ordinary
# campaign (configs/upnquick/aligned_cot.yaml) named below by study and rank
# rather than by run id -- so an edited training config comes back as a missing
# adapter rather than as a silently mismatched reference.
version: 1
seed: 11

# The damaged rank-16 adapter the recorded grid swept. Same run, not a retrain.
damaged_arm:
  config: configs/upnquick/conditional_trace_rate.yaml
  study: trace_permuted_full
  model: qwen25_7b_base
  rank: 16

# The solution the corruption prevented. Set to null to run the study without
# it -- the shrinkage control stands on its own and does not need this arm.
clean_arm:
  config: configs/upnquick/aligned_cot.yaml
  study: trace_aligned_full
  model: qwen25_7b_base
  rank: 16

# The compression arm: rank one at every width, which is the line the recorded
# result walked. `rank1_b16` doubles as the alpha = 1 end of the head sweep.
compression_bits: [1, 2, 4, 8, 16]

# The shrinkage control. alpha = 0 is the base model and alpha = 1 is
# `rank1_b16`, both already conditions, so neither is repeated here. The points
# are dense where the recorded scale study found the effect turning over
# (0.1 to 0.3) and thin above it.
scale_sweep_head: [0.03, 0.1, 0.2, 0.3, 0.5, 0.7, 1.0]
# The whole trained update turned down, which is a different claim and needs
# only enough points to show its shape.
scale_sweep_full: [0.1, 0.3, 0.5]

# The exact shrinkage control: for each coded cell, the scalar rescaling of
# the same rank-one directions with the same decoded update norm. This is the
# comparison the study turns on, and it is declared per bit width so it is
# exact at every rung rather than only at the one the recovery happens on.
# 16 is omitted: the 16-bit code barely moves the norm, so its exact match is
# alpha ~ 1, which `scale_head_1.0` already measures.
norm_matched_bits: [1, 2, 4, 8]

# The aligned adapter is scored raw and at the one rung the damaged adapter
# recovers on, which is what says whether one bit at rank one is a good code
# for an update generally or only for a corrupted one.
clean_compression_bits: [1]

# Corpora and scoring, copied from configs/upnquick/matched_bit_budget.yaml so
# the accuracies are directly comparable with the recorded grid.
calibration_rows: 128
gsm8k_test_rows: 500
symbolic_instances: [0]
symbolic_source: prepared/gsm-symbolic-source.jsonl
symbolic_sha256: 945055837b232bd9b56827b1e3a5aa019075f29e8ba4669d9a9df8b4439a291f
generation_batch_size: 32
max_new_tokens: 512
bootstrap_draws: 10000
analysis_seed: 9162026

# The likelihood probe. 256 paired rows, scored on the reasoning span only:
# the answer line is identical between a row's permuted and aligned variants,
# so including it would dilute exactly the difference being measured.
nll_rows: 256
nll_batch_size: 4
answer_marker: 'The answer is:'

# How many words of a generated rationale count as its opening, for the share
# of answers that recite the modal one. 24 matches the recorded prefix-collapse
# measure in figures_top10/06_f03-prefix-collapse.png.
opening_words: 24

# Rows for the throughput probe, which sizes the night before it is committed.
probe_rows: 64
