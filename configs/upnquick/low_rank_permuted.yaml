# Host variant for upnquick, generated by scripts/make_host_config.py and then
# scoped for a single GPU. Two fields differ from the generated file:
#
#   test_rows   500 rather than 1,319. The campaign generates over this split
#               once per run as its own record, which this study never reads --
#               it rescores every adapter itself. 500 is not arbitrary: it is
#               exactly the row count configs/upnquick/matched_bit_budget.yaml
#               sweeps, and `study_data` slices this same prepared file, so the
#               split must not be *smaller* than the study's or the sweep would
#               silently score fewer questions than it asked for.
#   codecs      one rung. The campaign encodes and evaluates every codec it is
#               given after training; this study builds its own grid from the
#               stored raw adapter, so paying for four more here buys nothing.
#
# Both are in the run identity, so this file mints its own run ids -- which the
# host variant already did by pinning a different model revision.
version: 1
information_rows: 256
evaluation_batch_size: 32
codecs:
  fp16:
    method: uniform
    bits: 16
models:
  qwen25_7b_base:
    name: Qwen/Qwen2.5-7B
    revision: d149729398750b98c0af14eb82c78cfe92750796
    backbone: nf4
    chat: false
adapters:
  all_linear_r1:
    method: full_lora
    rank: 1
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    last_n_layers: null
    alpha: 2
    dropout: 0.0
  all_linear_r2:
    method: full_lora
    rank: 2
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    last_n_layers: null
    alpha: 4
    dropout: 0.0
  all_linear_r4:
    method: full_lora
    rank: 4
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    last_n_layers: null
    alpha: 8
    dropout: 0.0
  all_linear_r8:
    method: full_lora
    rank: 8
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    last_n_layers: null
    alpha: 16
    dropout: 0.0
  all_linear_r32:
    method: full_lora
    rank: 32
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    last_n_layers: null
    alpha: 64
    dropout: 0.0
  all_linear_r64:
    method: full_lora
    rank: 64
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    last_n_layers: null
    alpha: 128
    dropout: 0.0
training:
  cot_full_1ep:
    epochs: 1
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
    label_span: all
datasets:
  cot_math_permuted:
    task_type: generative
    train_source:
      path: meta-math/MetaMathQA
      name: default
      revision: aa4f34d3d2d3231299b5b03d9b3e5a20da45aa18
      split: train
      converter: metamath
    answer_marker: 'The answer is:'
    rationale_control: permuted
    validation_rows: 256
    train_rows: 32000
    test_rows: 500
    evaluations:
    - key: gsm8k
      path: openai/gsm8k
      name: main
      revision: 740312add88f781978c0658806c59bc2815b9866
      split: test
      converter: gsm8k
    screening_metric: exact_match
    maximum_baseline_score: 0.85
    minimum_validation_nll_gain_bits_per_token: 0.02
studies:
  permuted_low_rank:
    kind: natural
    models:
    - qwen25_7b_base
    datasets:
    - cot_math_permuted
    seeds:
    - 11
    - 22
    - 33
    adapters:
    - all_linear_r1
    - all_linear_r2
    - all_linear_r4
    - all_linear_r8
    training: cot_full_1ep
  permuted_high_rank:
    kind: natural
    models:
    - qwen25_7b_base
    datasets:
    - cot_math_permuted
    seeds:
    - 11
    - 22
    - 33
    adapters:
    - all_linear_r32
    - all_linear_r64
    training: cot_full_1ep
