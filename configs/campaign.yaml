version: 1

precisions: [2, 3, 4, 8, 16]
clip_percentiles: [99.0, 99.9, 100.0]
multiple_choice_labels: [" A", " B", " C", " D", " E"]

models:
  qwen3_8b_instruct:
    name: Qwen/Qwen3-8B
    revision: b968826d9c46dd6066d109eabc6255188de91218
    backbone: nf4
    chat: true
    disable_thinking: true
  mistral_7b_instruct:
    name: mistralai/Mistral-7B-Instruct-v0.3
    revision: c170c708c41dac9275d15a8fff4eca08d52bab71
    backbone: nf4
    chat: true

adapters:
  seeded_all_qv_r16:
    method: seeded_b
    rank: 16
    target_modules: [q_proj, v_proj]
    last_n_layers: null
    alpha: 32
  full_all_r16:
    method: full_lora
    rank: 16
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 32

training:
  gsm8k:
    epochs: 3
    learning_rate: 0.0001
    effective_batch_size: 32
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
  commonsense_qa:
    epochs: 3
    learning_rate: 0.0001
    effective_batch_size: 32
    micro_batch_size: 4
    max_length: 512
    warmup_ratio: 0.03
    weight_decay: 0.0
  arc_challenge:
    epochs: 10
    learning_rate: 0.0001
    effective_batch_size: 32
    micro_batch_size: 4
    max_length: 512
    warmup_ratio: 0.03
    weight_decay: 0.0
  openbookqa:
    epochs: 5
    learning_rate: 0.0001
    effective_batch_size: 32
    micro_batch_size: 4
    max_length: 512
    warmup_ratio: 0.03
    weight_decay: 0.0

datasets:
  gsm8k:
    path: openai/gsm8k
    name: main
    revision: 740312add88f781978c0658806c59bc2815b9866
    train_split: train
    test_split: test
    validation_rows: 512
    screening_metric: exact_match
    maximum_baseline_score: 0.80
    minimum_raw_gain: 0.05
  commonsense_qa:
    path: tau/commonsense_qa
    name: default
    revision: 94630fe30dad47192a8546eb75f094926d47e155
    task_type: multiple_choice
    train_split: train
    test_split: validation
    validation_rows: 512
    question_field: question
    screening_metric: accuracy
    maximum_baseline_score: 0.80
    minimum_raw_gain: 0.05
  arc_challenge:
    path: allenai/ai2_arc
    name: ARC-Challenge
    revision: 210d026faf9955653af8916fad021475a3f00453
    task_type: multiple_choice
    train_split: train
    validation_split: validation
    test_split: test
    question_field: question
    screening_metric: accuracy
    maximum_baseline_score: 0.80
    minimum_raw_gain: 0.05
  openbookqa:
    path: allenai/openbookqa
    name: main
    revision: 388097ea7776314e93a529163e0fea805b8a6454
    task_type: multiple_choice
    train_split: train
    validation_split: validation
    test_split: test
    question_field: question_stem
    screening_metric: accuracy
    maximum_baseline_score: 0.80
    minimum_raw_gain: 0.05
  ifeval:
    path: google/IFEval
    revision: 966cd89545d6b6acfd7638bc708b98261ca58e84
    split: train

studies:
  real_tasks_qwen:
    kind: natural
    models: [qwen3_8b_instruct]
    datasets: [gsm8k, commonsense_qa, arc_challenge, openbookqa]
    seeds: [11, 22, 33]
    adapters: [seeded_all_qv_r16, full_all_r16]
    training: gsm8k
    training_by_dataset:
      gsm8k: gsm8k
      commonsense_qa: commonsense_qa
      arc_challenge: arc_challenge
      openbookqa: openbookqa
  real_tasks_mistral:
    kind: natural
    models: [mistral_7b_instruct]
    datasets: [gsm8k, commonsense_qa, arc_challenge, openbookqa]
    seeds: [11, 22, 33]
    adapters: [seeded_all_qv_r16, full_all_r16]
    training: gsm8k
    training_by_dataset:
      gsm8k: gsm8k
      commonsense_qa: commonsense_qa
      arc_challenge: arc_challenge
      openbookqa: openbookqa
