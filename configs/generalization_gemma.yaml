# Generalization test, replicated on a second family and a second home task.
#
# Receiver: Gemma-2-9B-it. Mistral-7B and Llama-3.1-8B were screened and fail as
# bases: on math they run to the generation limit on most rows (Mistral 78% of
# GSM8K), so "base" is not a working model to beat. Gemma is usable on MATH-500
# (0.55) and too easy on GSM8K (0.88), so the home task moves to competition
# math: NuminaMath-CoT, a different corpus from MetaMathQA, scored on MATH-500.
# The corruption is the same: each solution's working is swapped for another
# problem's, keeping the final \boxed{} answer.
#
# The panel is spectral_breadth's, re-tiered around the new home: MMLU math and
# AQuA are tier 1, GSM8K and the word-problem sets tier 2, the rest unchanged.
# Filters are chosen on reserved NuminaMath rows only. The ordering to confirm:
# corrupted < base < compressed corrupted, with the clean adapter as reference.
version: 1
models:
  gemma2_9b_it:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/google/gemma-2-9b-it
    revision: dsdir-shared-store
    backbone: nf4
    chat: true
adapters:
  all_linear_r16:
    method: full_lora
    rank: 16
    alpha: 32
    dropout: 0.0
    last_n_layers: null
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
training:
  cot_full_1ep:
    epochs: 1
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 400
    restore_best: false
    label_span: all
codecs:
  fp16:
    method: uniform
    bits: 16
    score_task: false
datasets:
  numina_cot:
    task_type: generative
    train_source:
      path: AI-MO/NuminaMath-CoT
      name: default
      revision: 9d8d210c9f6a36c8f3cd84045668c9b7800ef517
      split: train
      converter: math
      group_field: problem
    answer_marker: \boxed{
    answer_bearing_only: true
    holdout_by_group: true
    validation_rows: 288
    train_rows: 24000
    test_rows: 500
    evaluations:
    - key: math
      path: HuggingFaceH4/MATH-500
      name: default
      revision: 6e4ed1a2a79af7d8630a6b768ec859cb5af4d3be
      split: test
      converter: math
    screening_metric: exact_match
    maximum_baseline_score: 0.85
    minimum_validation_nll_gain_bits_per_token: 0.0
  numina_cot_permuted:
    task_type: generative
    train_source:
      path: AI-MO/NuminaMath-CoT
      name: default
      revision: 9d8d210c9f6a36c8f3cd84045668c9b7800ef517
      split: train
      converter: math
      group_field: problem
    answer_marker: \boxed{
    answer_bearing_only: true
    holdout_by_group: true
    validation_rows: 288
    train_rows: 24000
    test_rows: 500
    evaluations:
    - key: math
      path: HuggingFaceH4/MATH-500
      name: default
      revision: 6e4ed1a2a79af7d8630a6b768ec859cb5af4d3be
      split: test
      converter: math
    screening_metric: exact_match
    maximum_baseline_score: 0.85
    minimum_validation_nll_gain_bits_per_token: 0.0
    rationale_control: permuted
studies:
  gen_clean:
    kind: natural
    models:
    - gemma2_9b_it
    datasets:
    - numina_cot
    seeds:
    - 11
    adapters:
    - all_linear_r16
    training: cot_full_1ep
  gen_permuted:
    kind: natural
    models:
    - gemma2_9b_it
    datasets:
    - numina_cot_permuted
    seeds:
    - 11
    adapters:
    - all_linear_r16
    training: cot_full_1ep
