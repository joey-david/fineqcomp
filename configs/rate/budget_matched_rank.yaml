# Budget-matched rank: the comparison this campaign has never made.
#
# Every rate measured so far fixes the rank at 16 and sweeps precision. That is
# one slice of the surface the project's question is about. Worse, below one
# bit the shipped ladder is not a precision code at all: `blend_widths` keeps a
# random fraction of rank directions and drops the rest, keyed on the pair name
# so it knows nothing about the weights. Every sub-one-bit point in this
# campaign is therefore random rank pruning, and the regime the campaign says
# it cares about, 0.15-0.35 bits per value, lies entirely inside it.
#
# So the real question is not how finely to quantize sixteen directions. It is
# whether, at a fixed number of bytes, you are better off training fewer
# directions and sending all of them than training sixteen and throwing some
# away. Three arms at matched file size:
#
#   a. train rank r, code every direction        <- this config
#   b. train rank 16, drop directions at random  <- already measured, 315 runs
#   c. train rank 16, drop the weakest by SVD    <- free, `rank-frontier`
#
# Arm (c) needs no training and runs on adapters already on the cluster. Run it
# first: if informed truncation does not beat the random mask it already has,
# the expensive arm is not worth starting.
#
# What the existing data says. On `lever_div_400` a rank-16 adapter returns 1.2
# to 3.1 times the held-out bits of a rank-64 adapter at every matched file
# size, and the gap widens as the budget falls. That establishes that the
# container costs what it costs; it says nothing about whether a smaller rank
# would have been enough, which is what this measures.
#
# Denominator, fixed before the run: every arm is scored as a fraction of the
# gain the *rank-16* adapter reached, never against its own weaker raw gain. A
# rank-4 adapter that keeps all of its own smaller gain has not won anything.
#
# Kill the claim unless rank 8 beats byte-matched rank-16 pruning by at least
# five points of retained gain on average, its paired interval excludes zero,
# and it wins in at least three of the four model-by-task blocks. Rank 4 is the
# dose-response check: if the ordering is 4 > 8 > 16 the story is rank, and if
# it is 8 > 4 and 8 > 16 there is an interior optimum, which is the more
# interesting result and the one that makes the budget a design input.
#
# Cost: 2 receivers x 2 corpora x 3 ranks x 3 seeds = 36 training runs.
version: 1
information_rows: 256
evaluation_batch_size: 32
codecs:
  uniform4: {method: uniform, bits: 4}
  uniform2: {method: uniform, bits: 2}
  blend1_50: {method: uniform, bits: 1, blend: 0.5}
  binary: {method: uniform, bits: 1}
  sub0_14_16: {method: uniform, bits: 0, blend: 0.875, score_task: false}
  sub0_12_16: {method: uniform, bits: 0, blend: 0.75, score_task: false}
  sub0_10_16: {method: uniform, bits: 0, blend: 0.625, score_task: false}
  sub0_08_16: {method: uniform, bits: 0, blend: 0.5}
  sub0_06_16: {method: uniform, bits: 0, blend: 0.375, score_task: false}
  sub0_04_16: {method: uniform, bits: 0, blend: 0.25, score_task: false}
  sub0_02_16: {method: uniform, bits: 0, blend: 0.125, score_task: false}
  sub0_01_16: {method: uniform, bits: 0, blend: 0.0625, score_task: false}
models:
  mistral_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/mistralai/Mistral-7B-v0.1
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  qwen25_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-7B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
adapters:
  # alpha/rank is held at 2.0 across all three, so the effective LoRA scale is
  # matched and a rank difference is a rank difference rather than a change in
  # how hard the update pushes.
  all_linear_r4:
    method: full_lora
    rank: 4
    target_modules: &targets [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 8
    dropout: 0.0
  all_linear_r8:
    method: full_lora
    rank: 8
    target_modules: *targets
    last_n_layers: null
    alpha: 16
    dropout: 0.0
  all_linear_r16:
    method: full_lora
    rank: 16
    target_modules: *targets
    last_n_layers: null
    alpha: 32
    dropout: 0.0
training:
  panel_4ep: &panel_4ep
    epochs: 4
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
datasets:
  panel_math:
    task_type: generative
    train_source: {path: meta-math/MetaMathQA, name: default, revision: aa4f34d3d2d3231299b5b03d9b3e5a20da45aa18, split: train, converter: metamath}
    validation_rows: 256
    train_rows: 8000
    test_rows: 1319
    evaluations:
    - {key: gsm8k, path: openai/gsm8k, name: main, revision: 740312add88f781978c0658806c59bc2815b9866, split: test, converter: gsm8k}
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
  kind_code:
    task_type: generative
    train_source: {path: ise-uiuc/Magicoder-Evol-Instruct-110K, name: default, revision: b0079beaa0361d82412520b873715bee59cc7dd4, split: train, converter: magicoder}
    validation_rows: 256
    train_rows: 8000
    test_rows: 164
    evaluations:
    - {key: humaneval, path: openai/openai_humaneval, name: openai_humaneval, revision: 7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544, split: test, converter: humaneval}
    screening_metric: pass_at_1
    maximum_baseline_score: 0.75
    minimum_validation_nll_gain_bits_per_token: 0.02
studies:
  rank_math:
    kind: natural
    models: &receivers [mistral_7b_base, qwen25_7b_base]
    datasets: [panel_math]
    seeds: &seeds [11, 22, 33]
    adapters: &ranks [all_linear_r4, all_linear_r8, all_linear_r16]
    training: panel_4ep
  rank_code:
    kind: natural
    models: *receivers
    datasets: [kind_code]
    seeds: *seeds
    adapters: *ranks
    training: panel_4ep
