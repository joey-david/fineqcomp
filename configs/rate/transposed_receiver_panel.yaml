# Transposed panel: one corpus at a time, eight receivers, nothing else moving.
#
# Every panel run so far varied the corpus inside a receiver and absorbed the
# receiver in a fixed effect. That design cannot test the claim the campaign
# makes. A corpus statistic takes the same value on every receiver, so it can
# only ever be graded on the corpus axis, where a zlib redundancy score and a
# token count already reach within-receiver Spearman 0.74 and beat every
# gradient measurement on a held-out receiver.
#
# Here the corpus is the block and the receiver is the contrast. Corpus size,
# rows, seeds, rank, optimizer and codec ladder are identical inside a block,
# so no corpus quantity can score at all: it is constant where the ranking is
# taken. Only a measurement that changes with the receiver can pass.
#
# The receivers are chosen so their distance to the three corpora is designed
# rather than incidental, and each contrast isolates one thing:
#
#   qwen25_7b_base vs qwen25_math_7b_base  same tokenizer and architecture,
#                                          one specialised on mathematics
#   gemma2_9b_base vs gemma2_9b_instruct   same tokenizer and pretraining,
#                                          different posterior
#   mistral_7b_base vs gemma2_9b_base      32k against 256k vocabulary on
#                                          identical text
#
# The first two pairs are the ones a corpus statistic cannot even distinguish:
# it returns the same number for both receivers by construction.
#
# Predictions recorded before any run:
#   1. The receiver ordering on kind_code differs from the ordering on
#      panel_math. A corpus statistic predicts the same ordering for both and
#      therefore cannot be right about both.
#   2. The ordering on xbrl_tags is flatter than on either, because no
#      receiver pretrained on XBRL tag prediction.
#   3. Tokens per character of the corpus, measured with no forward pass,
#      orders the receivers within a block with negative sign.
#   4. qwen25_math_7b_base needs a lower rate than qwen25_7b_base on
#      panel_math and the same rate on xbrl_tags.
#
# Cost: 3 corpora x 7 receivers x 3 seeds = 63 runs on the shared 4-epoch
# contract, plus the dense sub-bit ladder each.
#
# StarCoder2-7B was the obvious code specialist and was dropped: its MLP is
# c_fc/c_proj rather than gate/up/down, so a rank-16 adapter on it is not the
# same object as on the other seven, and the rate axis is bits per adapter
# value.
version: 1
information_rows: 256
evaluation_batch_size: 32
codecs:
  uniform2: {method: uniform, bits: 2}
  blend1_50: {method: uniform, bits: 1, blend: 0.5}
  binary: {method: uniform, bits: 1}
  sub0_14_16: {method: uniform, bits: 0, blend: 0.875, score_task: false}
  sub0_12_16: {method: uniform, bits: 0, blend: 0.75, score_task: false}
  sub0_10_16: {method: uniform, bits: 0, blend: 0.625, score_task: false}
  sub0_08_16: {method: uniform, bits: 0, blend: 0.5}
  sub0_06_16: {method: uniform, bits: 0, blend: 0.375, score_task: false}
  sub0_05_16: {method: uniform, bits: 0, blend: 0.3125, score_task: false}
  sub0_04_16: {method: uniform, bits: 0, blend: 0.25, score_task: false}
  sub0_03_16: {method: uniform, bits: 0, blend: 0.1875, score_task: false}
  sub0_02_16: {method: uniform, bits: 0, blend: 0.125, score_task: false}
  sub0_01_16: {method: uniform, bits: 0, blend: 0.0625, score_task: false}
models:
  # Every path is verified present on the Jean-Zay shared store. Three general
  # bases carry over from the existing campaign.
  mistral_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/mistralai/Mistral-7B-v0.1
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  llama31_8b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/meta-llama/Llama-3.1-8B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  qwen25_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-7B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  qwen3_8b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen3-8B-Base
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  # The interaction test in its purest form: same architecture, same
  # tokenizer, same family as qwen25_7b_base, specialised on mathematics. Any
  # corpus statistic gives these two receivers identical values.
  qwen25_math_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-Math-7B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  # The tokenizer lever: 256k pieces against Mistral's 32k on identical text.
  gemma2_9b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/google/gemma-2-9b
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  # Same tokenizer and pretraining as gemma2_9b_base, different posterior. The
  # prompt format is deliberately the base one on both, so the weights are the
  # only thing that differs.
  gemma2_9b_instruct:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/google/gemma-2-9b-it
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
adapters:
  all_linear_r16:
    method: full_lora
    rank: 16
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 32
    dropout: 0.0
training:
  panel_4ep: &panel_4ep
    epochs: 4
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
datasets:
  kind_code:
    task_type: generative
    train_source: {path: ise-uiuc/Magicoder-Evol-Instruct-110K, name: default, revision: b0079beaa0361d82412520b873715bee59cc7dd4, split: train, converter: magicoder}
    validation_rows: 256
    train_rows: 8000
    test_rows: 164
    evaluations:
    - {key: humaneval, path: openai/openai_humaneval, name: openai_humaneval, revision: 7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544, split: test, converter: humaneval}
    screening_metric: pass_at_1
    maximum_baseline_score: 0.75
    minimum_validation_nll_gain_bits_per_token: 0.02
  panel_math:
    task_type: generative
    train_source: {path: meta-math/MetaMathQA, name: default, revision: aa4f34d3d2d3231299b5b03d9b3e5a20da45aa18, split: train, converter: metamath}
    validation_rows: 256
    train_rows: 8000
    test_rows: 1319
    evaluations:
    - {key: gsm8k, path: openai/gsm8k, name: main, revision: 740312add88f781978c0658806c59bc2815b9866, split: test, converter: gsm8k}
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
  xbrl_tags:
    task_type: generative
    train_source: {path: wangd12/XBRL_analysis, name: tags, revision: 6ee79f739a6c51d4ec39921693ee3d7e0cd54c17, split: train, converter: xbrl_tags}
    validation_rows: 256
    train_rows: 8000
    test_rows: 500
    evaluations:
    - {key: xbrl_tags, path: wangd12/XBRL_analysis, name: tags, revision: 6ee79f739a6c51d4ec39921693ee3d7e0cd54c17, split: test, converter: xbrl_tags}
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
studies:
  transposed_code:
    kind: natural
    models: &receivers
    - mistral_7b_base
    - llama31_8b_base
    - qwen25_7b_base
    - qwen3_8b_base
    - qwen25_math_7b_base
    - gemma2_9b_base
    - gemma2_9b_instruct
    datasets: [kind_code]
    seeds: &seeds [11, 22, 33]
    adapters: &adapter [all_linear_r16]
    training: panel_4ep
  transposed_math:
    kind: natural
    models: *receivers
    datasets: [panel_math]
    seeds: *seeds
    adapters: *adapter
    training: panel_4ep
  transposed_xbrl:
    kind: natural
    models: *receivers
    datasets: [xbrl_tags]
    seeds: *seeds
    adapters: *adapter
    training: panel_4ep
