# The one intervention that worked, on the two new corpora.
#
# Row count is held and only the number of distinct source groups behind those
# rows changes -- domains for text-to-SQL, filing companies for XBRL. This is
# the same lever that moved R* from 0.682 to 0.746 on MetaMathQA seed problems,
# which is the only positive in the whole campaign, and it has never been tried
# on another corpus or another frozen model.
#
# The row caps differ because the corpora do. Ten of a hundred SQL domains still
# clear 8,000 rows; ten of thirty XBRL companies only clear about 3,300, so that
# arm caps at 3,000 and its lever spans three rather than ten.
# This half: 8,000 rows, 10 / 25 / 100 domains, a factor of ten.
