# Is R*(0.90) a property of the learned update or of how it is factored?
#
# The codec codes LoRA-A and LoRA-B one rank direction at a time and, below one
# bit, drops random rank directions from both. It therefore sees the factors,
# not B @ A, and (B Q^-1, Q A) is the same update in other factors. Two
# questions follow, one per study family:
#
#   gauge_*  the post-hoc question. Train the paper's adapters, then rerun the
#            same codec ladder after refactoring each pair with a family of Q
#            (scripts/analysis/adapter_spectrum_profile.py, MODE=gauge). These
#            two receivers' seed-11 adapters join Mistral's seed-11 default
#            adapters from init_* in the sweep.
#   init_*   the training question. Start LoRA-A from Q A0 instead of A0, with
#            Q orthogonal (`rotated`) or of condition number 10
#            (`conditioned`). B starts at zero, so the model at step zero is
#            unchanged; only the optimiser's starting factors differ. Three
#            seeds per arm give the noise to read the difference against.
#   scale_*  are receiver differences just capability? Qwen2.5 at 0.5B, 1.5B,
#            3B and 14B on the same corpora, joining gauge_*'s Qwen2.5-7B.
#
# Two reviewer checks ride on the same adapters: R* under a second codec
# (rank-frontier truncation of the strongest singular directions) for the
# seed-11 panel and scale adapters, and the alpha90/gamma rate rule on every
# adapter here, against tests fixed in results/rate/reparameterization/.
#
# Models, corpora, rows, training contract and codec ladder are copied from
# transposed_receiver_panel.yaml, so the default-init adapters reproduce that
# panel's seed-11 cells. Task scores are off on every rung: R* is read on
# held-out bits saved, and the task score only costs time here. Launch the
# whole thing with scripts/jean_zay/reparameterization.sh.
version: 1
information_rows: 256
evaluation_batch_size: 32
codecs:
  uniform2: {method: uniform, bits: 2, score_task: false}
  blend1_50: {method: uniform, bits: 1, blend: 0.5, score_task: false}
  binary: {method: uniform, bits: 1, score_task: false}
  sub0_14_16: {method: uniform, bits: 0, blend: 0.875, score_task: false}
  sub0_12_16: {method: uniform, bits: 0, blend: 0.75, score_task: false}
  sub0_10_16: {method: uniform, bits: 0, blend: 0.625, score_task: false}
  sub0_08_16: {method: uniform, bits: 0, blend: 0.5, score_task: false}
  sub0_06_16: {method: uniform, bits: 0, blend: 0.375, score_task: false}
  sub0_05_16: {method: uniform, bits: 0, blend: 0.3125, score_task: false}
  sub0_04_16: {method: uniform, bits: 0, blend: 0.25, score_task: false}
  sub0_03_16: {method: uniform, bits: 0, blend: 0.1875, score_task: false}
  sub0_02_16: {method: uniform, bits: 0, blend: 0.125, score_task: false}
  sub0_01_16: {method: uniform, bits: 0, blend: 0.0625, score_task: false}
models:
  # Jean-Zay's shared model store ($DSDIR); the launcher checks each one is
  # readable by the submitting account before anything is queued.
  mistral_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/mistralai/Mistral-7B-v0.1
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  qwen25_7b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-7B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  llama31_8b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/meta-llama/Llama-3.1-8B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  # Paths as in configs/recovery/scale_and_tasks_jz.yaml, which ran on Jean-Zay.
  qwen25_0p5b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-0.5B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  qwen25_1p5b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-1.5B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  qwen25_3b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-3B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
  qwen25_14b_base:
    name: /lustre/fsmisc/dataset/HuggingFace_Models/Qwen/Qwen2.5-14B
    revision: dsdir-shared-store
    backbone: nf4
    chat: false
adapters:
  all_linear_r16: &adapter
    method: full_lora
    rank: 16
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    last_n_layers: null
    alpha: 32
    dropout: 0.0
  all_linear_r16_rotated:
    <<: *adapter
    init: rotated
  all_linear_r16_conditioned:
    <<: *adapter
    init: conditioned
    init_kappa: 10
training:
  panel_4ep:
    epochs: 4
    learning_rate: 0.0002
    effective_batch_size: 16
    micro_batch_size: 4
    max_length: 1024
    warmup_ratio: 0.03
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    eval_every_updates: 200
datasets:
  kind_code:
    task_type: generative
    train_source: {path: ise-uiuc/Magicoder-Evol-Instruct-110K, name: default, revision: b0079beaa0361d82412520b873715bee59cc7dd4, split: train, converter: magicoder}
    validation_rows: 256
    train_rows: 8000
    test_rows: 164
    evaluations:
    - {key: humaneval, path: openai/openai_humaneval, name: openai_humaneval, revision: 7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544, split: test, converter: humaneval}
    screening_metric: pass_at_1
    maximum_baseline_score: 0.75
    minimum_validation_nll_gain_bits_per_token: 0.02
  panel_math:
    task_type: generative
    train_source: {path: meta-math/MetaMathQA, name: default, revision: aa4f34d3d2d3231299b5b03d9b3e5a20da45aa18, split: train, converter: metamath}
    validation_rows: 256
    train_rows: 8000
    test_rows: 1319
    evaluations:
    - {key: gsm8k, path: openai/gsm8k, name: main, revision: 740312add88f781978c0658806c59bc2815b9866, split: test, converter: gsm8k}
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
  xbrl_tags:
    task_type: generative
    train_source: {path: wangd12/XBRL_analysis, name: tags, revision: 6ee79f739a6c51d4ec39921693ee3d7e0cd54c17, split: train, converter: xbrl_tags}
    validation_rows: 256
    train_rows: 8000
    test_rows: 500
    evaluations:
    - {key: xbrl_tags, path: wangd12/XBRL_analysis, name: tags, revision: 6ee79f739a6c51d4ec39921693ee3d7e0cd54c17, split: test, converter: xbrl_tags}
    screening_metric: exact_match
    maximum_baseline_score: 0.8
    minimum_validation_nll_gain_bits_per_token: 0.02
studies:
  gauge_code: &gauge
    kind: natural
    models: [qwen25_7b_base, llama31_8b_base]
    datasets: [kind_code]
    seeds: [11]
    adapters: [all_linear_r16]
    training: panel_4ep
  gauge_math:
    <<: *gauge
    datasets: [panel_math]
  gauge_xbrl:
    <<: *gauge
    datasets: [xbrl_tags]
  init_code: &init
    kind: natural
    models: [mistral_7b_base]
    datasets: [kind_code]
    seeds: [11, 22, 33]
    adapters: [all_linear_r16, all_linear_r16_rotated, all_linear_r16_conditioned]
    training: panel_4ep
  init_math:
    <<: *init
    datasets: [panel_math]
  init_xbrl:
    <<: *init
    datasets: [xbrl_tags]
  scale_code: &scale
    kind: natural
    models: [qwen25_0p5b_base, qwen25_1p5b_base, qwen25_3b_base, qwen25_14b_base]
    datasets: [kind_code]
    seeds: [11]
    adapters: [all_linear_r16]
    training: panel_4ep
  scale_math:
    <<: *scale
    datasets: [panel_math]
  scale_xbrl:
    <<: *scale
    datasets: [xbrl_tags]
