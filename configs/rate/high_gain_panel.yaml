# Two tasks where the published base-to-LoRA gap is very large.
#
# Every corpus in the campaign so far moves held-out likelihood a lot and task
# accuracy a little, which makes the accuracy axis nearly useless as a check on
# the bits axis. These two are the opposite. Text-to-SQL takes Qwen-7B from 16.1
# to 61.0 exact match with a LoRA on Spider; the FinLoRA XBRL tasks take base
# models from the 13-32% band to above 80%. Both have answers short enough to
# score by exact string match and a test split genuinely disjoint from training,
# so neither needs an executor or a held-out schema file.
#
# Same rank, rows, epochs and rungs as `model_panel.yaml`, and the same two
# frozen substrates, so the two panels join into one table.
version: 1
information_rows: 256
evaluation_batch_size: 32
codecs:
  uniform2:
    method: uniform
    bits: 2
  blend1_50:
    method: uniform
    bits: 1
    blend: 0.5
  binary:
    method: uniform
    bits: 1
  sub0_14_16:
    method: uniform
    bits: 0
    blend: 0.875
    score_task: false
  sub0_13_16:
    method: uniform
    bits: 0
    blend: 0.8125
    score_task: false
  sub0_12_16:
    method: uniform
    bits: 0
    blend: 0.75
    score_task: false
  sub0_11_16:
    method: uniform
    bits: 0
    blend: 0.6875
    score_task: false
  sub0_10_16:
    method: uniform
    bits: 0
    blend: 0.625
    score_task: false
  sub0_09_16:
    method: uniform
    bits: 0
    blend: 0.5625
    score_task: false
  sub0_08_16:
    method: uniform
    bits: 0
    blend: 0.5
  sub0_07_16:
    method: uniform
    bits: 0
    blend: 0.4375
    score_task: false
  sub0_06_16:
    method: uniform
    bits: 0
    blend: 0.375
    score_task: false
  sub0_05_16:
    method: uniform
    bits: 0
