version: 1

# Keep the architecture fixed and vary only task information.  The 16 labels
# contribute exactly four independent source bits whenever a new random mapping
# must be specified.
# This exact snapshot is already cached on both target systems. The controlled
# task stays short even with a 7B base because prompts and responses are tiny.
model: mistral_7b_base
adapter: all_linear_r16
seeds: [11, 22, 33]

labels:
  [" A", " B", " C", " D", " E", " F", " G", " H",
   " I", " J", " K", " L", " M", " N", " O", " P"]
codebook_dir: codebooks
items_per_family: 16
repeats_per_mapping: 4
prefix_mappings: [32, 128, 512]

# random: every mapping receives a fresh random label -> 4*N source bits.
# structured_pK: K random 16-item prototype tables are reused across families
# -> source information saturates at 64*K bits once all prototypes are seen.
conditions:
  - name: structured_p1
    prototype_count: 1
  - name: structured_p4
    prototype_count: 4
  - name: structured_p16
    prototype_count: 16
  - name: random
    prototype_count: null

# Short prompts make this much cheaper than the natural-task campaign.  A fresh
# adapter is trained from the same deterministic initialization for each prefix.
training:
  epochs: 4
  learning_rate: 0.0002
  effective_batch_size: 16
  micro_batch_size: 16
  max_length: 128
  warmup_ratio: 0.05
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  max_grad_norm: 1.0

evaluation_batch_size: 128
retention_target: 0.90

# One uniform code family spans the crossing. Below one bit it keeps a fixed
# fraction of paired rank directions at one bit; above one bit it gives a fixed
# fraction of rows two bits. Every rate is the size of a decoded file.
adapter_codecs:
  - {key: sub0_0625, bits: 0, blend: 0.0625}
  - {key: sub0_125, bits: 0, blend: 0.125}
  - {key: sub0_250, bits: 0, blend: 0.25}
  - {key: sub0_375, bits: 0, blend: 0.375}
  - {key: sub0_500, bits: 0, blend: 0.5}
  - {key: sub0_625, bits: 0, blend: 0.625}
  - {key: sub0_750, bits: 0, blend: 0.75}
  - {key: sub0_875, bits: 0, blend: 0.875}
  - {key: binary, bits: 1}
  - {key: blend1_25, bits: 1, blend: 0.25}
  - {key: blend1_50, bits: 1, blend: 0.5}
  - {key: blend1_75, bits: 1, blend: 0.75}
  - {key: uniform2, bits: 2}
